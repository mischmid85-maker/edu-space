<style>

<script>
"use strict";
/* ---------- Sprachdaten ---------- */
const FORMS = {

  f: { je: "fais", tu: "fais", il: "fait", nous: "faisons", vous: "faites", ils: "font" },
  a: { je: "vais", tu: "vas", il: "va", nous: "allons", vous: "allez", ils: "vont" }
};
const INF = { e: "être", f: "faire", a: "aller" };
const VERBS = ["e", "f", "a"];
const PERSONS = ["je", "tu", "il", "nous", "vous", "ils"];
const PLABEL = { je: "je", tu: "tu", il: "il / elle / on", nous: "nous", vous: "vous", ils: "ils / elles" };
const PRON = { je: ["je"], tu: ["tu"], il: ["il", "elle", "on"], nous: ["nous"], vous: ["vous"], ils: ["ils", "elles"] };
const AVOIR = ["ai", "as", "a", "avons", "avez", "ont"];

const DISTRACT = {
  e: { je: ["es", "est", "sont"], tu: ["est", "suis", "êtes"], il: ["es", "et", "sont"],
       nous: ["sont", "êtes", "somme"], vous: ["êtez", "sont", "sommes"], ils: ["son", "est", "sontent"] },
  f: { je: ["fait", "fai", "font"], tu: ["fait", "faites", "fai"], il: ["fais", "font", "faites"],
       nous: ["faisont", "fesons", "font"], vous: ["faisez", "faitez", "font"], ils: ["faisent", "fons", "faisons"] },
  a: { je: ["vas", "va", "alle"], tu: ["va", "vais", "alles"], il: ["vas", "a", "alle"],
       nous: ["vont", "allont", "allez"], vous: ["allons", "vont", "aller"], ils: ["allent", "von", "allons"] }
};

/* [Verb, Person, Satz, Übersetzung] */
const BANK = [
  ["e","je","Je {} en retard pour le cours de maths.","Ich bin zu spät für die Mathestunde."],
  ["e","je","Je {} content de te voir.","Ich bin froh, dich zu sehen."],

  ["e","tu","Tu {} où maintenant ?","Wo bist du jetzt?"],

  ["e","il","Mon frère {} très sympa.","Mein Bruder ist sehr nett."],
  ["e","il","Elle {} à la maison ce soir.","Sie ist heute Abend zu Hause."],
  ["e","il","On {} à la gare de Lausanne.","Wir sind am Bahnhof Lausanne."],

  ["e","nous","Nous {} en classe de français.","Wir sind in der Französischstunde."],

  ["e","ils","Mes parents {} au travail.","Meine Eltern sind bei der Arbeit."],
  ["e","ils","Elles {} dans le train pour Genève.","Sie sind im Zug nach Genf."],
  ["e","ils","Les élèves {} dans la cour.","Die Schülerinnen und Schüler sind auf dem Pausenplatz."],
  ["f","je","Je {} du vélo le samedi.","Am Samstag fahre ich Velo."],
  ["f","je","Je {} mes devoirs après l'école.","Ich mache meine Hausaufgaben nach der Schule."],
  ["f","je","Ce soir, je {} une pizza.","Heute Abend mache ich eine Pizza."],
  ["f","tu","Qu'est-ce que tu {} ce week-end ?","Was machst du dieses Wochenende?"],
  ["f","tu","Tu {} du ski à Verbier ?","Fährst du in Verbier Ski?"],
  ["f","tu","Tu {} souvent la cuisine ?","Kochst du oft?"],
  ["f","il","Il {} beau aujourd'hui.","Heute ist schönes Wetter."],
  ["f","il","Ma sœur {} de la natation.","Meine Schwester geht schwimmen."],
  ["f","il","En janvier, il {} très froid.","Im Januar ist es sehr kalt."],
  ["f","nous","Nous {} une promenade au bord du lac.","Wir machen einen Spaziergang am See."],
  ["f","nous","Nous {} du théâtre à l'école.","Wir spielen in der Schule Theater."],
  ["f","nous","Le dimanche, nous {} la grasse matinée.","Am Sonntag schlafen wir aus."],
  ["f","vous","Qu'est-ce que vous {} dans la vie ?","Was machen Sie beruflich?"],
  ["f","vous","Vous {} du sport le mercredi ?","Treibt ihr am Mittwoch Sport?"],
  ["f","vous","Vous {} trop de bruit !","Ihr macht zu viel Lärm!"],
  ["f","ils","Mes amis {} de la musique ensemble.","Meine Freunde machen zusammen Musik."],
  ["f","ils","Elles {} les courses au marché.","Sie kaufen auf dem Markt ein."],
  ["f","ils","Les enfants {} un bonhomme de neige.","Die Kinder machen einen Schneemann."],
  ["e","ils","Mes voisins {} très gentils.","Meine Nachbarn sind sehr freundlich."],
  ["a","je","Je {} à l'école à pied.","Ich gehe zu Fuss zur Schule."],
  ["a","je","Demain, je {} chez le dentiste.","Morgen gehe ich zum Zahnarzt."],
  ["a","je","Je {} bien, merci.","Mir geht es gut, danke."],
  ["a","tu","Tu {} au cinéma ce soir ?","Gehst du heute Abend ins Kino?"],
  ["a","tu","Comment {}-tu ?","Wie geht es dir?"],
  ["a","tu","Où {}-tu en vacances ?","Wohin gehst du in die Ferien?"],
  ["a","il","Ça {} bien ?","Geht es dir gut?"],
  ["a","il","Mon père {} à Zurich en train.","Mein Vater fährt mit dem Zug nach Zürich."],
  ["a","il","Elle {} à la piscine le lundi.","Am Montag geht sie ins Schwimmbad."],
  ["a","nous","Nous {} à la montagne en février.","Im Februar gehen wir in die Berge."],
  ["a","nous","Nous {} au marché samedi.","Am Samstag gehen wir auf den Markt."],

  ["a","vous","Comment {}-vous, Madame ?","Wie geht es Ihnen, Madame?"],
  ["a","vous","Vous {} à la fête ce soir ?","Geht ihr heute Abend ans Fest?"],
  ["a","vous","Vous y {} à pied ?","Geht ihr zu Fuss dorthin?"],
  ["a","ils","Mes cousins {} en Italie cet été.","Meine Cousins fahren diesen Sommer nach Italien."],
  ["a","ils","Elles {} au concert ce soir.","Sie gehen heute Abend ans Konzert."],
  ["a","ils","Ils y {} en train.","Sie fahren mit dem Zug dorthin."]
];
/* Sätze, die auch ohne Übersetzung eindeutig sind (für den Défi) */
const DEFI = ["Nous {} voisins depuis dix ans.", "Vous {} prêts pour le test ?", "Madame, vous {} française ?", "Mes voisins {} très gentils.",
  "Nous {} une promenade au bord du lac.", "Qu'est-ce que vous {} dans la vie ?", "Elles {} les courses au marché.", "Les enfants {} un bonhomme de neige.",
  "Nous y {} demain.", "Comment {}-vous, Madame ?", "Vous y {} à pied ?", "Ils y {} en train."];

/* [Verb, Person, Satz, Übersetzung, gezeigte Form] */
const DETECT_WRONG = [
  ["f","vous","Vous {} un exposé.","Ihr macht einen Vortrag.","faisez"],
  ["f","ils","Ils {} une pause.","Sie machen eine Pause.","faisent"],
  ["f","je","Je {} du foot.","Ich spiele Fussball.","fait"],
  ["f","nous","Nous {} un gâteau.","Wir machen einen Kuchen.","faisont"],
  ["f","il","Il {} chaud.","Es ist heiss.","fais"],
  ["e","vous","Vous {} en avance.","Ihr seid zu früh.","êtez"],
  ["e","ils","Elles {} à la piscine.","Sie sind im Schwimmbad.","sontent"],
  ["e","tu","Tu {} mon meilleur ami.","Du bist mein bester Freund.","est"],
  ["e","il","Il {} dans le bus.","Er ist im Bus.","es"],
  ["e","nous","Nous {} à Berne.","Wir sind in Bern.","sont"],
  ["a","je","Je {} au cinéma.","Ich gehe ins Kino.","alle"],
  ["a","tu","Tu {} à Zurich ?","Gehst du nach Zürich?","va"],
  ["a","il","Il {} au stade.","Er geht ins Stadion.","vas"],
  ["a","nous","Nous {} au parc.","Wir gehen in den Park.","allont"],
  ["a","vous","Vous {} à Bâle ?","Fahrt ihr nach Basel?","vont"],
  ["a","ils","Ils {} au lit.","Sie gehen ins Bett.","allent"]
];
const DETECT_RIGHT = [
  ["f","vous","Vous {} du théâtre ?","Spielt ihr Theater?"],
  ["f","ils","Ils {} du bruit.","Sie machen Lärm."],
  ["f","tu","Tu {} la vaisselle.","Du wäschst das Geschirr ab."],
  ["f","nous","Nous {} du yoga.","Wir machen Yoga."],
  ["e","vous","Vous {} très gentils.","Ihr seid sehr freundlich."],
  ["e","nous","Nous {} au collège.","Wir sind in der Schule."],
  ["e","il","Elle {} fatiguée.","Sie ist müde."],
  ["e","ils","Ils {} en Suisse.","Sie sind in der Schweiz."],
  ["a","vous","Vous {} à Lugano ?","Fahrt ihr nach Lugano?"],
  ["a","je","Je {} à la gare.","Ich gehe zum Bahnhof."],
  ["a","il","Elle {} à Berne.","Sie fährt nach Bern."],
  ["a","ils","Ils {} à l'école.","Sie gehen zur Schule."]
];

const RULES = {
  vous: { title: "Die vous-Form", rule: "Bei être und faire gibt es kein -ez: vous êtes, vous faites. aller ist hier regelmässig: vous allez." },
  ils: { title: "Die ils-Form", rule: "Kurz und ohne -ent: ils sont, ils font, ils vont. Alle drei enden auf -ont." },
  nous: { title: "Die nous-Form", rule: "nous sommes ist unregelmässig. nous faisons und nous allons enden auf -ons (nicht -ont). faisons schreibt man mit «ai», auch wenn es wie «fe» klingt." },
  singular: { title: "-s oder -t in der Einzahl", rule: "je und tu enden auf -s: je suis, tu es, je fais, tu fais. il, elle und on enden auf -t: il est, il fait." },
  singularA: { title: "Die Einzahl von aller", rule: "je vais, tu vas, il va. Nur je hat -ais, tu hat -as, und il, elle, on haben einfach -a, ohne -t." },
  allerReg: { title: "aller ist unregelmässig", rule: "aller ist kein normales -er-Verb: je vais, tu vas, il va, ils vont. Nur nous allons und vous allez beginnen mit all-." },
  inf: { title: "Grundform statt Verbform", rule: "être, faire und aller sind Grundformen. Im Satz brauchst du die Form, die zum Subjekt passt." },
  person: { title: "Pronomen und Verbform", rule: "Schau zuerst auf das Subjekt und frage: Wer tut etwas? Danach wählst du die passende Form." },
  verb: { title: "être, faire oder aller?", rule: "être heisst «sein» (wie, wo, wer jemand ist). faire heisst «machen»: faire du sport, faire la cuisine, il fait beau. aller heisst «gehen» oder «fahren»: aller à l'école, aller en train, ça va." },
  avoir: { title: "Verwechslung mit avoir", rule: "ai, as, a, avons, avez, ont sind Formen von avoir (haben). Gesucht ist hier être, faire oder aller." },
  accent: { title: "Der Accent", rule: "vous êtes schreibt man mit ê. vous faites und die Formen von aller haben keinen Accent." },
  spelling: { title: "Genaue Schreibweise", rule: "Die Form klingt ähnlich, wird aber anders geschrieben. Präge dir das Schriftbild ein: suis, fais, vais, est, fait, va." },
  other: { title: "Form noch einmal ansehen", rule: "Diese Form gibt es so nicht. Lies die Tabelle laut und schreibe die Form einmal ab." }
};

/* ---------- Auswertung einer Antwort ---------- */
function norm(s) {
  return String(s || "").toLowerCase().replace(/[’`]/g, "'").trim().replace(/\s+/g, " ")
    .replace(/[.!?]+$/, "").trim().replace(/\s*-\s*(?:je|tu|il|elle|on|nous|vous|ils|elles)$/, "")
    .replace(/^(?:(?:je|tu|il|elle|on|nous|vous|ils|elles)\s+|j')/, "");
}
function plain(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function dist(a, b) {
  let row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const next = [i];
    for (let j = 1; j <= b.length; j++) {
      next[j] = Math.min(row[j] + 1, next[j - 1] + 1, row[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    row = next;
  }
  return row[b.length];
}
const isSing = p => p === "je" || p === "tu" || p === "il";
function personType(p, v) { return isSing(p) ? (v === "a" ? "singularA" : "singular") : p; }

/* Gibt null (richtig) oder den Fehlertyp zurück. */
function classify(given, v, p) {
  const g = norm(given), t = FORMS[v][p], pg = plain(g);
  if (g === t) return null;
  if (pg === plain(t)) return "accent";
  if (Object.values(INF).some(x => plain(x) === pg)) return "inf";
  if (AVOIR.includes(g)) return "avoir";
  if (VERBS.some(x => x !== v && Object.values(FORMS[x]).some(f => plain(f) === pg))) return "verb";
  const samePerson = PERSONS.find(q => plain(FORMS[v][q]) === pg);
  if (samePerson) return isSing(p) && isSing(samePerson) ? personType(p, v) : "person";
  if (v === "a" && ["alle", "alles", "allent"].includes(pg)) return "allerReg";
  const d = dist(pg, plain(t));
  if (!isSing(p)) return d <= 4 && Object.values(FORMS[v]).some(f => plain(f)[0] === pg[0]) ? p : "other";
  return d <= 2 ? "spelling" : "other";
}

/* ---------- Aufgaben zusammenstellen ---------- */
const STEPS = {
  1: { t: "Les formes", d: "Tippe auf die richtige Verbform." },
  2: { t: "être, faire ou aller ?", d: "Welches Verb passt? Schreibe die richtige Form in die Lücke." },
  3: { t: "Détective", d: "Prüfe das unterstrichene Verb. Stimmt es?" },
  4: { t: "Deuxième chance", d: "Diese Formen waren noch unsicher. Jetzt klappt es!" },
  5: { t: "Défi", d: "Keine Fehler bisher! Jetzt ohne Übersetzung." },
  6: { t: "Training", d: "Du übst gezielt deine unsicheren Formen." }
};
const LIMIT = 600000;
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const pick = a => a[Math.floor(Math.random() * a.length)];

function takeSentence(st, v, p) {
  let pool = BANK.filter(b => b[0] === v && b[1] === p);
  let fresh = pool.filter(b => !st.seen.includes(b[2]));
  if (!fresh.length) { st.seen = st.seen.filter(s => !pool.some(b => b[2] === s)); fresh = pool; }
  const b = pick(fresh); st.seen.push(b[2]);
  return { v, p, fr: b[2], de: b[3] };
}
function buildMain(st) {
  /* Jedes Verb: 4 Personen in Etappe 1, die 2 übrigen in Etappe 2. So kommen alle 18 Formen vor. */
  const ps = shuffle(PERSONS), vs = shuffle(VERBS), first = [], gaps = [];
  vs.forEach((v, n) => {
    const rest = [ps[2 * n], ps[2 * n + 1]];
    PERSONS.filter(p => !rest.includes(p)).forEach(p => first.push({ kind: "mc", step: 1, v, p, pron: pick(PRON[p]), options: shuffle([FORMS[v][p], ...DISTRACT[v][p]]) }));
    rest.concat(pick(["nous", "vous", "ils"])).forEach(p => gaps.push(Object.assign(takeSentence(st, v, p), { kind: "gap", step: 2 })));
  });
  const det = [];
  shuffle(VERBS).forEach((v, n) => {
    const wrong = shuffle(DETECT_WRONG.filter(d => d[0] === v)).slice(0, n === 0 ? 2 : 1);
    wrong.forEach(d => det.push({ kind: "detect", step: 3, v, p: d[1], fr: d[2], de: d[3], shown: d[4] }));
    if (n) { const r = pick(DETECT_RIGHT.filter(d => d[0] === v)); det.push({ kind: "detect", step: 3, v, p: r[1], fr: r[2], de: r[3], shown: null }); }
  });
  return shuffle(first).concat(shuffle(gaps), shuffle(det));
}
function weakForms(results) {
  const n = {};
  results.filter(r => r.type).forEach(r => { const k = r.v + "|" + r.p; n[k] = (n[k] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a]);
}
function buildRepair(st, elapsed) {
  const weak = weakForms(st.results);
  if (elapsed > 540000) return [];
  const max = elapsed > 450000 ? 3 : 5;
  if (!weak.length) {
    return VERBS.map(v => {
      const pool = BANK.filter(b => b[0] === v && DEFI.includes(b[2]));
      const b = pick(pool.filter(x => !st.seen.includes(x[2])).concat(pool).slice(0, Math.max(1, pool.filter(x => !st.seen.includes(x[2])).length)));
      st.seen.push(b[2]);
      return { v, p: b[1], fr: b[2], de: b[3], kind: "gap", step: 5, hideDe: true };
    });
  }
  return weak.slice(0, max).map(k => {
    const [v, p] = k.split("|");
    return Object.assign(takeSentence(st, v, p), { kind: "gap", step: 4, hint: true });
  });
}
function buildFocus(st, keys) {
  const items = [];
  for (let i = 0; items.length < 8; i++) {
    const [v, p] = keys[i % keys.length].split("|");
    items.push(Object.assign(takeSentence(st, v, p), { kind: "gap", step: 6, hint: true }));
  }
  return shuffle(items);
}

/* ---------- Gesamtauswertung ---------- */
function cellsOf(results) {
  const c = {};
  for (const v of VERBS) for (const p of PERSONS) {
    const rs = results.filter(r => r.v === v && r.p === p);
    let status = "none";
    if (rs.length) status = rs.every(r => !r.type) ? "sure" : (rs[rs.length - 1].type ? "work" : "almost");
    c[v + "|" + p] = { status, n: rs.length };
  }
  return c;
}
function summarize(results, focus) {
  const scored = results.filter(r => focus || r.step <= 3);
  const sum = a => a.reduce((s, r) => s + r.credit, 0);
  const part = v => { const a = scored.filter(r => r.v === v); return { pts: sum(a), max: a.length, pct: a.length ? Math.round(100 * sum(a) / a.length) : 0 }; };
  const types = {};
  results.filter(r => r.type).forEach(r => { (types[r.type] = types[r.type] || []).push(r); });
  const order = Object.keys(types).sort((a, b) => (a === "accent") - (b === "accent") || types[b].length - types[a].length);
  const repair = results.filter(r => r.step === 4);
  return {
    pts: sum(scored), max: scored.length, pct: scored.length ? Math.round(100 * sum(scored) / scored.length) : 0,
    e: part("e"), f: part("f"), a: part("a"), types, order, cells: cellsOf(results),
    repairOk: repair.filter(r => !r.type).length, repairN: repair.length
  };
}

/* ---------- Oberfläche ---------- */
if (typeof document !== "undefined") {
  const app = document.getElementById("app");
  let S = { screen: "start", name: "" };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => String(Math.round(n * 10) / 10);
  const CHECK = '<svg class="ok" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 18l8 9L29 7"/></svg>';
  const CROSS = '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M8 8l18 18"/><path d="M26 8L8 26"/></svg>';
  const HALF = '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M5 20c5-9 9-9 13-4s8 4 11-4"/></svg>';
  const PRAISE = ["Exact !", "Bravo !", "C'est ça !", "Très bien !", "Parfait !"];
  const elapsed = () => S.spent + (Date.now() - S.t0);

  function start(mode, keys) {
    const seen = S.seen || [];
    S = { screen: "q", name: S.name, seen, results: [], i: 0, fb: null, fix: false, repairBuilt: false, focus: mode === "focus", timeUp: false, spent: 0, t0: Date.now() };
    S.items = mode === "focus" ? buildFocus(S, keys) : buildMain(S);
    render();
  }
  function record(given, type, extra) {
    const it = S.items[S.i];
    const rec = Object.assign({ v: it.v, p: it.p, step: it.step, kind: it.kind, fr: it.fr || null, de: it.de || null, pron: it.pron || null,
      given, type, credit: type === null ? 1 : type === "accent" ? 0.5 : 0, praise: pick(PRAISE) }, extra);
    S.results.push(rec); S.fb = rec; S.fix = false; render();
  }
  function next() {
    S.fb = null; S.i++;
    if (elapsed() >= LIMIT) { S.timeUp = S.i < S.items.length || !S.repairBuilt; return finish(); }
    if (S.i >= S.items.length) {
      if (!S.focus && !S.repairBuilt) {
        S.repairBuilt = true;
        S.items = S.items.concat(buildRepair(S, elapsed()));
      }

    }

  }
  function finish() { S.spent = elapsed(); S.screen = "result"; render(); }

  function sentenceHtml(it, form) {
    const parts = esc(it.fr).split("{}");
    return parts[0] + form + parts[1];
  }
  function fullSentence(r) {
    if (r.kind === "mc") return esc(r.pron) + " <b>" + FORMS[r.v][r.p] + "</b>";

  }

  }
  function explain(r) {
    const t = FORMS[r.v][r.p], g = norm(r.given);

    if (r.type === "accent") return t === "êtes" ? "Fast! Nur der Accent fehlt oder stimmt nicht: Es heisst êtes mit ê." : "Fast! " + t + " schreibt man ohne Accent.";
    if (r.type === "spelling" && g === "et") return "«et» heisst «und». Das Verb schreibt man est. Beides klingt gleich.";
    if (r.type === "ils" && g === "son") return "«son» heisst «sein / ihr». Das Verb schreibt man sont, mit -t.";
    if (r.type === "avoir" && t === "va") return "«a» gehört zu avoir. Die Form von aller heisst va, mit v.";

      return "Das ist eine Form von " + INF[from] + ". Hier brauchst du " + INF[r.v] + ". " + RULES.verb.rule;

  }

  function renderStart() {
    app.innerHTML = `<div class="sheet stack">
      <h1>être, faire <span>&amp;</span> aller</h1>
      <p class="lead">Wiederhole die drei wichtigen Verben im Présent. Du arbeitest allein und erhältst am Schluss eine persönliche Rückmeldung.</p>
      <ol class="plan">
        <li><b>Les formes</b><span>ca. 1½ Min.</span><small>12 Formen schnell antippen</small></li>
        <li><b>être, faire ou aller ?</b><span>ca. 3 Min.</span><small>9 Sätze ergänzen</small></li>
        <li><b>Détective</b><span>ca. 2 Min.</span><small>6 Sätze prüfen und korrigieren</small></li>

  }

  function renderQ() {
    const it = S.items[S.i], meta = STEPS[it.step], r = S.fb;
    const stepItems = S.items.filter(x => x.step === it.step);
    const pos = S.items.slice(0, S.i + 1).filter(x => x.step === it.step).length;

  function verdict(s) {
