<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present Continuous Arena</title>
<style>
:root{--ink:#1b2447;--sun:#ffc93c;--mint:#19b394;--coral:#ff5d5d;--sky:#e6efff;--paper:#fbfcff}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:17px/1.5 "Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.hi{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:.3px}
.logo b{color:var(--sun)}
.xp{flex:1;min-width:90px}
.xp small{display:block;font-size:13px;opacity:.9}
.xb{height:10px;background:#ffffff33;border-radius:9px;overflow:hidden}
.xb i{display:block;height:100%;background:var(--sun);transition:width .5s}
main{max-width:760px;margin:auto;padding:16px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:18px;margin:0 0 18px}
.btn{font:inherit;font-weight:800;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.m{background:var(--mint);color:#fff}
.gh{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;text-decoration:underline;padding:6px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #2f6bff;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.ms{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:14px;cursor:pointer}
.ms:hover{background:#fff7da}
.ms .e{font-size:32px}.ms h3{margin:.1em 0}.ms p{margin:0;font-size:15px}
.stars{font-size:22px;color:var(--sun);-webkit-text-stroke:1px var(--ink);letter-spacing:2px}
.bd{display:flex;flex-wrap:wrap;gap:8px}
.bd span{border:2px solid var(--ink);border-radius:20px;padding:3px 10px;background:#fff;font-size:15px}
.bd .off{opacity:.35;filter:grayscale(1)}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{flex:1;height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);transition:width .4s}
.ins{margin:0;font-size:15px;opacity:.8}
.pr{font-size:24px;font-weight:800;margin:.5em 0 .8em}
.gap{border-bottom:4px solid var(--coral);padding:0 .6em;color:var(--coral)}
input#a{width:100%;font:inherit;font-size:20px;padding:12px;border:3px solid var(--ink);border-radius:12px}
#fb{margin:12px 0;padding:0;font-weight:600}
#fb div{padding:10px 14px;border-radius:12px;border:3px solid var(--ink)}
.ok{background:#c8f5e8}.tip{background:#fff1b8}.bad{background:#ffd3d3}
.row{display:flex;justify-content:flex-end}
.combo{text-align:center;font-weight:800;font-size:18px}
.big{text-align:center}.big .stars{font-size:48px}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}
td,th{border:2px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--sun)}
details{border:3px solid var(--ink);border-radius:14px;background:var(--paper);margin:0 0 12px;box-shadow:0 4px 0 var(--ink)}
summary{font-weight:800;padding:12px 16px;cursor:pointer;font-size:18px}
details>div{padding:0 16px 12px}
.tw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.tw{grid-template-columns:1fr}.pr{font-size:21px}}
mark{background:#ffe38a;padding:0 3px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-weight:800;display:none;z-index:9;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hi"><div class="logo">Present <b>Continuous</b> Arena</div><div class="xp"><small id="lv"></small><div class="xb"><i id="xb"></i></div></div></div></header>
<main id="v"></main>
<div id="toast" role="status"></div>
<script>
const $=q=>document.querySelector(q),V=$("#v");
let S;try{S=JSON.parse(localStorage.getItem("pcarena"))}catch(e){}
S=S||{xp:0,st:{},bd:[],mx:0};
const sv=()=>{try{localStorage.setItem("pcarena",JSON.stringify(S))}catch(e){}};
const TI=["Rookie","Runner","Racer","Sprinter","Champion","Legend"];
const lvl=()=>Math.floor(S.xp/100)+1;
function hdr(){$("#lv").textContent="Level "+lvl()+" · "+TI[Math.min(lvl()-1,5)]+" · "+S.xp+" XP";$("#xb").style.width=(S.xp%100)+"%"}
const BD={first:["🥇","Erste Runde"],perf:["💎","Perfekte Runde"],combo:["🔥","5er-Combo"],lv3:["🚀","Level 3"],all:["🗺️","Alle Missionen"],mix:["⚖️","Simple-oder-Continuous-Profi"]};
function award(id){if(S.bd.includes(id))return;S.bd.push(id);toast("Neues Abzeichen: "+BD[id][0]+" "+BD[id][1])}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",2800)}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* Aufgaben: [Aufgabe, Lösung(en), Verb, (Typ s/c bei Mix), (Spezialtipp)] */
const D={
pos:{e:"✅",n:"Positive Sätze",d:"Schreibe die richtige Form (am/is/are + Verb-ing) in die Lücke.",it:[
["Tom ___ (play) football right now.","is playing","play"],
["I ___ (read) a great book at the moment.","am reading","read"],
["Look! The kids ___ (swim) in the lake.","are swimming","swim"],
["My mum ___ (make) pasta in the kitchen.","is making","make"],
["We ___ (wait) for the bus.","are waiting","wait"],
["Listen! Somebody ___ (sing).","is singing","sing"],
["The dog ___ (run) after the ball.","is running","run"],
["You ___ (study) very hard this week.","are studying","study"],
["Sara and Lea ___ (dance) in the living room.","are dancing","dance"],
["It ___ (rain) in St. Gallen today.","is raining","rain"],
["He ___ (lie) on the sofa.","is lying","lie"],
["I ___ (sit) next to Jonas.","am sitting","sit"],
["They ___ (write) a test now.","are writing","write"]]},
neg:{e:"🚫",n:"Verneinte Sätze",d:"Schreibe die verneinte Form (am/is/are + not + Verb-ing) in die Lücke.",it:[
["Anna ___ (not / watch) TV.","is not watching","watch"],
["I ___ (not / sleep).","am not sleeping","sleep"],
["We ___ (not / play) computer games.","are not playing","play"],
["The boys ___ (not / run) today.","are not running","run"],
["My dad ___ (not / work) at the moment.","is not working","work"],
["You ___ (not / listen) to me!","are not listening","listen"],
["It ___ (not / snow) now.","is not snowing","snow"],
["Mia ___ (not / use) her phone.","is not using","use"],
["They ___ (not / swim) in the lake.","are not swimming","swim"],
["I ___ (not / eat) my lunch.","am not eating","eat"],
["He ___ (not / sit) in class.","is not sitting","sit"]]},
yn:{e:"❓",n:"Ja/Nein-Fragen",d:"Bilde aus den Wörtern eine ganze Frage im present continuous.",it:[
["you / listen / to me","Are you listening to me?","listen"],
["he / play / football","Is he playing football?","play"],
["they / wait / for us","Are they waiting for us?","wait"],
["Mia / do / her homework","Is Mia doing her homework?","do"],
["it / rain","Is it raining?","rain"],
["we / go / to the right room","Are we going to the right room?","go"],
["your parents / work","Are your parents working?","work"],
["I / talk / too loud","Am I talking too loud?","talk"],
["the cat / sleep / on my bed","Is the cat sleeping on my bed?","sleep"],
["you / make / a video","Are you making a video?","make"]]},
wh:{e:"🔎",n:"Fragen mit Fragewort",d:"Bilde aus den Wörtern eine ganze Frage mit Fragewort.",it:[
["What / you / do","What are you doing?","do"],
["Where / Tom / go","Where is Tom going?","go"],
["Why / she / laugh","Why is she laughing?","laugh"],
["Who / you / wait for","Who are you waiting for?","wait"],
["What / they / eat","What are they eating?","eat"],
["Where / we / sit","Where are we sitting?","sit"],
["How / he / get / home","How is he getting home?","get"],
["Why / the children / shout","Why are the children shouting?","shout"],
["What / I / write","What am I writing?","write"],
["Which book / you / read","Which book are you reading?","read"]]},
mix:{e:"⚖️",n:"Simple oder Continuous?",d:"Present simple oder present continuous? Schreibe die richtige Form in die Lücke.",it:[
["Look! Max ___ (ride) his new bike.","is riding","ride","c"],
["Max ___ (ride) his bike to school every day.","rides","ride","s"],
["I usually ___ (get) up at seven.","get","get","s"],
["Listen! The baby ___ (cry).","is crying","cry","c"],
["My sister ___ (play) the piano on Mondays.","plays","play","s"],
["We ___ (have) lunch at the moment.","are having","have","c"],
["Water ___ (boil) at 100 degrees.","boils","boil","s"],
["It ___ (not / rain) very often in summer.","does not rain","rain","s"],
["She ___ (not / like) spiders.","does not like","like","s","Like gehört zu den „Gefühls-Verben“ (like, love, want, know …). Sie stehen fast nie in der -ing-Form."],
["Right now, the pupils ___ (write) a test.","are writing","write","c"],
["I ___ (know) the answer!","know","know","s","Know gehört zu den „Wissens-Verben“ (know, understand, believe …). Sie stehen fast nie in der -ing-Form."],
["Tom ___ (not / do) his homework now.","is not doing","do","c"],
["My dad ___ (work) in a bank.","works","work","s"],
["The bus ___ (leave) every ten minutes.","leaves","leave","s"],
["Be quiet! I ___ (try) to sleep.","am trying","try","c"],
["Anna ___ (want) a new phone.","wants","want","s","Want gehört zu den „Gefühls-Verben“ (like, love, want, need …). Sie stehen fast nie in der -ing-Form."]]}
};
/* Auswertung */
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/[.?!,]/g,"").replace(/\s+/g," ").trim();
const DBL=/^(run|sit|swim|get|stop|put|begin|shop|win|cut|plan|jog|hit|chat)$/;
const ing=v=>/ie$/.test(v)?v.slice(0,-2)+"ying":/[^e]e$/.test(v)?v.slice(0,-1)+"ing":DBL.test(v)?v+v.slice(-1)+"ing":v+"ing";
function spell(v){return /ie$/.test(v)?"Verben auf -ie: ie wird zu y (lie → lying).":/[^e]e$/.test(v)?"Ein stummes -e am Ende fällt weg (make → making).":DBL.test(v)?"Kurzer Vokal + ein Konsonant am Ende: Konsonant verdoppeln (run → running).":"Hänge einfach -ing an das Verb (play → playing)."}
function fb(c,it,inp){
 const n=norm(inp),ex=norm(it[1].split("|")[0]),B=/\b(am|is|are)\b/,hi=/\b\w+ing\b/.test(n);
 if(c=="mix"){
  if(it[3]=="s"){
   if(B.test(n)&&hi)return "Das ist eine Gewohnheit oder ein Fakt (oder ein Gefühls-/Wissens-Verb) → present simple, nicht am/is/are + -ing. "+(it[4]||"");
   if(/not/.test(ex)&&!/\b(do|does) not\b/.test(n))return "Verneinung im present simple: do/does + not + Grundform (he/she/it → does not).";
   if(it[4]&&hi)return it[4];
   if(!/not/.test(ex))return "Present simple: Bei he/she/it kommt ein -s ans Verb (play → plays), bei I/you/we/they nicht. Signalwörter: usually, every day, on Mondays … "+(it[4]||"");
  }else if(!hi||!B.test(n))return "Hier passiert etwas gerade jetzt (Look!, Listen!, now, at the moment …) → present continuous: am/is/are + Verb-ing.";
 }
 if(!n)return "";
 if(c=="yn"&&!/^(am|is|are)\b/.test(n))return "Bei Ja/Nein-Fragen steht am/is/are ganz vorne: Is he playing …?";
 if(c=="wh"){const w=ex.split(" ")[0];if(n.split(" ")[0]!=w)return "Beginne mit dem Fragewort «"+w+"». Dann folgt am/is/are, dann die Person, dann Verb-ing."}
 if(!B.test(n))return "Es fehlt am/is/are. Present continuous = am/is/are + Verb-ing.";
 const eb=ex.match(B)[1],ib=n.match(B)[1];
 if(eb!=ib)return "Prüfe die Form von «be»: I → am, he/she/it → is, we/you/they → are.";
 if(!hi)return "Das Verb braucht die -ing-Form (zum Beispiel play → playing).";
 if(/\bnot\b/.test(ex)&&!/\bnot\b/.test(n))return "Verneinung: am/is/are + not + Verb-ing (isn’t, aren’t, I’m not).";
 if(it[2]&&!n.includes(ing(it[2])))return "Achte auf die Schreibweise von -ing: "+spell(it[2]);
 if(c=="wh"&&!new RegExp("^[\\w ]+? (am|is|are) ").test(n))return "Wortstellung: Fragewort + am/is/are + Person + Verb-ing.";
 return "Fast! Kontrolliere Wortstellung, Rechtschreibung und Leerschläge.";
}
/* Spiel */
let G=null;
function stars(n){return "★".repeat(n)+"☆".repeat(3-n)}
function home(){G=null;
 V.innerHTML=`<div class=card><h1>Los geht’s! 🏁</h1><p>Sammle XP, steige im Level auf und hol dir alle Sterne und Abzeichen. Im Theorie-Bereich kannst du jederzeit nachlesen.</p><button class="btn m" onclick="theory()">📖 Theorie</button></div>
 <h2>Missionen</h2><div class=grid>${Object.keys(D).map(k=>`<button class=ms onclick="start('${k}')"><div class=e>${D[k].e}</div><h3>${D[k].n}</h3><div class=stars aria-label="${S.st[k]||0} von 3 Sternen">${stars(S.st[k]||0)}</div></button>`).join("")}</div>
 <h2 style="margin-top:22px">Abzeichen</h2><div class="card bd">${Object.keys(BD).map(k=>`<span class="${S.bd.includes(k)?"":"off"}">${BD[k][0]} ${BD[k][1]}</span>`).join("")}</div>
 <p style="text-align:center"><button class=gh onclick="if(confirm('Wirklich alles zurücksetzen?')){S={xp:0,st:{},bd:[],mx:0};sv();hdr();home()}">Fortschritt zurücksetzen</button></p>`;hdr();scrollTo(0,0)}
function start(c){G={c,it:shuf(D[c].it.slice()).slice(0,c=="mix"?10:8),i:0,t:0,cb:0,pts:0,xp:0,ok:false,l0:lvl()};q()}
function q(){const it=G.it[G.i],g=G.c=="yn"||G.c=="wh",pr=g?it[0]:it[0].replace("___",'<span class=gap>&nbsp;&nbsp;&nbsp;</span>');
 V.innerHTML=`<div class=bar><button class=gh onclick="home()">✕ Abbrechen</button><div class=prog><i style="width:${G.i/G.it.length*100}%"></i></div><b>${G.i+1}/${G.it.length}</b></div>
 <div class=card><p class=ins>${D[G.c].d}</p><p class=pr>${pr}</p><input id=a autocomplete=off autocapitalize=off spellcheck=false aria-label="Deine Antwort" placeholder="Deine Antwort …"><div id=fb aria-live=polite></div><div class=row><button id=go class=btn onclick="chk()">Prüfen</button></div></div><div class=combo>🔥 Combo: ${G.cb}</div>`;$("#a").focus();scrollTo(0,0)}
const say=(t,c)=>$("#fb").innerHTML=`<div class=${c}>${t}</div>`;
function done(){G.ok=true;$("#a").disabled=true;$("#go").textContent=G.i+1==G.it.length?"Ergebnis":"Weiter";$("#go").focus();hdr()}
function chk(){
 if(G.ok){G.i++;G.t=0;G.ok=false;return G.i>=G.it.length?end():q()}
 const it=G.it[G.i],n=norm($("#a").value);
 if(!n)return say("Schreib zuerst eine Antwort.","tip");
 const ok=it[1].split("|").some(x=>norm(x)==n);G.t++;
 if(ok){let g=5;if(G.t==1){g=10+Math.min(G.cb,5)*2;G.cb++;G.pts++}else G.pts+=.5;
  if(G.cb>S.mx)S.mx=G.cb;if(G.cb>=5)award("combo");
  G.xp+=g;S.xp+=g;sv();say("Richtig! +"+g+" XP"+(G.t==1&&G.cb>1?" (Combo!)":""),"ok");done()}
 else if(G.t==1){G.cb=0;say("Noch nicht ganz. Tipp: "+fb(G.c,it,$("#a").value)+" Versuch es nochmals!","tip");$("#a").focus()}
 else{say("Die richtige Lösung ist: <b>"+it[1].split("|")[0]+"</b>. Merk sie dir gut, dann klappt’s beim nächsten Mal.","bad");done()}
}
function end(){const r=G.pts/G.it.length,s=r>=.85?3:r>=.6?2:r>=.3?1:0,b=s==3?20:0;
 S.xp+=b;G.xp+=b;S.st[G.c]=Math.max(S.st[G.c]||0,s);
 award("first");if(G.pts==G.it.length)award("perf");if(G.c=="mix"&&s==3)award("mix");if(lvl()>=3)award("lv3");if(Object.keys(D).every(k=>S.st[k]>0))award("all");sv();hdr();
 const up=lvl()>G.l0,c=G.c;
 V.innerHTML=`<div class="card big"><h1>${s==3?"Mega! 🎉":s>0?"Gut gemacht! 👏":"Weiter üben! 💪"}</h1><div class=stars>${stars(s)}</div><p><b>+${G.xp} XP</b>${b?" (inkl. 20 Bonus für 3 Sterne)":""}</p>${up?"<p><b>🚀 Level-Up! Du bist jetzt Level "+lvl()+" ("+TI[Math.min(lvl()-1,5)]+")</b></p>":""}<p>Du hast ${Math.round(G.pts)} von ${G.it.length} Aufgaben auf Anhieb geschafft.</p>
 <button class="btn m" onclick="start('${c}')">Nochmals</button> <button class=btn onclick="home()">Übersicht</button><p><button class=gh onclick="theory()">📖 Theorie nachlesen</button></p></div>`;G=null;scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&G&&$("#go"))chk()});
/* Theorie */
function theory(){G=null;V.innerHTML=`<div class=bar><button class=gh onclick="home()">← Zurück</button></div><h1>📖 Theorie: present continuous</h1>
<details open><summary>Wann brauchen wir es?</summary><div>
<p>Wir brauchen das present continuous (Verlaufsform der Gegenwart), wenn etwas <b>genau jetzt</b> passiert oder <b>um die Gegenwart herum</b> im Gang ist.</p>
<p>🔹 Jetzt: <i>Look! It’s raining.</i><br>🔹 Zeitraum um jetzt: <i>I’m reading a good book this week.</i><br>🔹 Fest geplante Zukunft: <i>I’m meeting Lea tomorrow.</i></p>
<p>Signalwörter: <mark>now, right now, at the moment, today, this week, Look!, Listen!</mark></p></div></details>
<details><summary>Bildung: positive Sätze</summary><div>
<p><b>am / is / are + Verb mit -ing</b></p>
<table><tr><th>Person</th><th>Form</th><th>Beispiel</th></tr><tr><td>I</td><td>am (I’m)</td><td>I’m playing.</td></tr><tr><td>he / she / it</td><td>is (he’s)</td><td>She is playing.</td></tr><tr><td>we / you / they</td><td>are (we’re)</td><td>They are playing.</td></tr></table></div></details>
<details><summary>Die -ing-Form richtig schreiben</summary><div><table>
<tr><th>Regel</th><th>Beispiel</th></tr>
<tr><td>normal: -ing anhängen</td><td>play → playing, study → studying</td></tr>
<tr><td>stummes -e fällt weg</td><td>make → making, write → writing</td></tr>
<tr><td>kurzer Vokal + 1 Konsonant: verdoppeln</td><td>run → running, sit → sitting, swim → swimming</td></tr>
<tr><td>-ie wird zu -y</td><td>lie → lying</td></tr></table></div></details>
<details><summary>Verneinung</summary><div><p><b>am / is / are + not + Verb-ing</b></p>
<p>I am not (I’m not) sleeping.<br>He is not (isn’t) sleeping.<br>We are not (aren’t) sleeping.</p>
<p>Kein <i>don’t</i> oder <i>doesn’t</i> im present continuous!</p></div></details>
<details><summary>Fragen</summary><div>
<p><b>Ja/Nein-Fragen:</b> am/is/are + Person + Verb-ing?</p><p><i>Are you listening? – Yes, I am. / No, I’m not.</i><br><i>Is he playing? – Yes, he is. / No, he isn’t.</i></p>
<p><b>Fragen mit Fragewort:</b> Fragewort + am/is/are + Person + Verb-ing?</p><p><i>Where are they going?<br>What is she doing?<br>Why am I waiting?</i></p></div></details>
<details><summary>Present simple oder present continuous?</summary><div><div class=tw>
<div><h3>Present simple</h3><p>Gewohnheiten, Fakten, Dauerhaftes</p><p><i>He plays football every Saturday.</i></p><p>Signalwörter: <mark>always, usually, often, sometimes, never, every day, on Mondays</mark></p><p>Bei he/she/it: Verb + <b>-s</b></p></div>
<div><h3>Present continuous</h3><p>Handlung genau jetzt</p><p><i>He is playing football now.</i></p><p>Signalwörter: <mark>now, at the moment, today, Look!, Listen!</mark></p><p>am/is/are + <b>-ing</b></p></div></div>
<p><b>Achtung:</b> Gefühls- und Wissens-Verben stehen fast nie in der -ing-Form, auch wenn es „jetzt“ ist: <mark>like, love, hate, want, need, know, understand, believe</mark>.<br><i>I know the answer.</i> (nicht: I am knowing)</p></div></details>
<p style="text-align:center"><button class="btn m" onclick="home()">Jetzt üben!</button></p>`;scrollTo(0,0)}
hdr();home();
</script>
</body>
</html>
