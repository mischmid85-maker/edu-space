<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Edu Space 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#ff6b9d; --purple:#a78bfa; --yellow:#ffd166; --teal:#4ecdc4; --blue:#4d96ff; }
  *{box-sizing:border-box;}
  body{
    font-family:'Baloo 2', sans-serif; margin:0; padding:2rem; min-height:100vh;
    background:linear-gradient(135deg,#ffe6f2 0%,#e6f2ff 50%,#fff9e6 100%);
    background-attachment:fixed; color:#333;
  }
  .header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;}
  h1{
    margin:0; font-weight:800; font-size:2.6rem;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:inline-block; transform:rotate(-1deg); animation:float 3.5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-4px) rotate(-1deg);}}
  .subtitle{margin-top:0.2rem;margin-bottom:0;color:#777;font-size:1.05rem;}
  .admin-btn{
    cursor:pointer;padding:0.5rem 1rem;border:none;border-radius:50px;
    background:#fff;color:#666;font-family:inherit;font-weight:700;font-size:0.9rem;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
  }
  .admin-btn.active{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;}

  #subjectGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.6rem;margin-top:2rem;}
  .subject-card{
    cursor:pointer;border:none;border-radius:20px;padding:2rem 1rem;
    display:flex;flex-direction:column;align-items:center;gap:0.6rem;
    color:#fff;font-family:inherit;font-weight:700;font-size:1.2rem;
    box-shadow:0 6px 0 rgba(0,0,0,.1), 0 10px 20px rgba(0,0,0,.1);
    transition:transform .15s ease;
  }
  .subject-card:hover{ transform:translateY(-6px) rotate(-1deg); }
  .subject-card .emoji{font-size:2.6rem;}
  .subject-card .count{font-size:0.85rem;font-weight:500;opacity:0.9;}
  .subject-card.deutsch{background:linear-gradient(135deg,var(--pink),#ff9bc0);}
  .subject-card.englisch{background:linear-gradient(135deg,var(--blue),#8ec6ff);}
  .subject-card.franzoesisch{background:linear-gradient(135deg,var(--purple),#c9b6ff);}

  .back-btn{
    cursor:pointer;padding:0.5rem 1.1rem;border:none;border-radius:50px;
    background:#fff;color:#555;font-family:inherit;font-weight:700;font-size:0.9rem;
    box-shadow:0 3px 8px rgba(0,0,0,.1);margin-bottom:1rem;
  }
  .subject-heading{display:flex;align-items:center;gap:0.6rem;margin:0.5rem 0 1.5rem;}
  .subject-heading .emoji{font-size:2rem;}
  .subject-heading h2{margin:0;font-size:1.8rem;font-weight:800;color:#444;}

  .toolbar{margin:1rem 0 1.8rem;min-height:3rem;}
  button#addBtn{
    cursor:pointer;padding:0.9rem 1.6rem;border:none;border-radius:50px;
    background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;
    font-family:inherit;font-weight:700;font-size:1.05rem;
    box-shadow:0 6px 0 #c94f81, 0 8px 14px rgba(0,0,0,.15);
    transition:transform .12s ease;
  }
  button#addBtn:hover{transform:translateY(-2px) scale(1.03) rotate(-1deg);}
  button#addBtn:disabled{opacity:0.5;cursor:not-allowed;}
  #status{margin-top:0.6rem;font-size:0.9rem;color:#888;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.6rem;}
  .card{
    background:#fff;border-radius:18px;
    box-shadow:0 6px 0 rgba(0,0,0,.06), 0 10px 20px rgba(0,0,0,.08);
    overflow:hidden;display:flex;flex-direction:column;border:3px solid #fff;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:nth-child(5n+1){border-color:var(--pink);}
  .card:nth-child(5n+2){border-color:var(--purple);}
  .card:nth-child(5n+3){border-color:var(--teal);}
  .card:nth-child(5n+4){border-color:var(--yellow);}
  .card:nth-child(5n+5){border-color:var(--blue);}
  .card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 10px 0 rgba(0,0,0,.06), 0 16px 26px rgba(0,0,0,.14);}
  .thumb{
    position:relative;width:100%;height:150px;overflow:hidden;border-bottom:2px dashed #eee;
    background:repeating-linear-gradient(45deg,#fafafa,#fafafa 10px,#fff 10px,#fff 20px);cursor:pointer;
  }
  .thumb iframe{position:absolute;top:0;left:0;width:800px;height:600px;border:none;transform:scale(0.275);transform-origin:top left;pointer-events:none;background:#fff;}
  .card-body{padding:0.8rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:0.5rem;background:#fffefc;}
  .card-title{font-size:0.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .remove-btn{background:#fff0f0;color:#e0507a;border:none;border-radius:50%;width:28px;height:28px;font-size:1rem;cursor:pointer;transition:transform .12s ease;}
  .remove-btn:hover{background:#ffd6e0;transform:scale(1.15) rotate(90deg);}
  #empty{color:#999;font-style:italic;font-size:1.1rem;padding:2rem;text-align:center;border:3px dashed #ddd;border-radius:20px;background:rgba(255,255,255,.5);}
  /* Anmelde-Fenster */
  #loginDialog{border:none;border-radius:20px;padding:1.5rem 1.6rem;box-shadow:0 16px 40px rgba(0,0,0,.25);font-family:inherit;max-width:340px;width:90%;}
  #loginDialog::backdrop{background:rgba(0,0,0,.35);}
  #loginDialog h3{margin:0 0 .8rem;}
  #loginDialog input{width:100%;box-sizing:border-box;padding:.6rem .8rem;font-size:1rem;border:2px solid #ddd;border-radius:12px;font-family:inherit;}
  #loginDialog .row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;}
  #loginDialog button{cursor:pointer;padding:.5rem 1rem;border:none;border-radius:50px;font-family:inherit;font-weight:700;}
  #loginOk{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;}
  #loginMsg{min-height:1.2em;margin:.5rem 0 0;color:#e0507a;font-size:.9rem;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>✨ Edu Space 🚀</h1>
    <p class="subtitle" id="subtitle">Wähle ein Fach aus:</p>
  </div>
  <button id="adminToggle" class="admin-btn">🔐 Admin</button>
</div>

<div id="homeView">
  <div id="subjectGrid"></div>
</div>

<div id="subjectView" style="display:none;">
  <button class="back-btn" id="backBtn">⬅ Zurück zur Fächerübersicht</button>
  <div class="subject-heading">
    <span class="emoji" id="subjectEmoji"></span>
    <h2 id="subjectLabel"></h2>
  </div>
  <div class="toolbar">
    <button id="addBtn" disabled>➕ HTML-Seite hinzufügen</button>
    <input type="file" id="fileInput" accept=".html,.htm" multiple hidden>
    <div id="status"></div>
  </div>
  <div id="grid"></div>
  <p id="empty" style="display:none;">🦄 Noch keine Seiten in diesem Fach.</p>
</div>

<dialog id="loginDialog">
  <form id="loginForm">
    <h3>🔐 Admin-Anmeldung</h3>
    <input type="password" id="loginInput" autocomplete="current-password" placeholder="Passwort">
    <p id="loginMsg"></p>
    <div class="row">
      <button type="button" id="loginCancel">Abbrechen</button>
      <button type="submit" id="loginOk">Anmelden</button>
    </div>
  </form>
</dialog>

<script>
/* ====== HIER ANPASSEN: deine GitHub-Daten ====== */
const OWNER  = 'mischmid85-maker';
const REPO   = 'edu-space';
const BRANCH = 'main';

/* Verschlüsselter GitHub-Token (erstellt mit token-verschluesseln.html).
   Ohne dein Passwort ist dieser Text wertlos.
   Leer lassen = Anmeldung wie früher direkt mit dem Token. */
const ENCRYPTED_TOKEN = 'v1.600000.55w4YNYdxuX75oSgsOCyoQ==.05vTZfqbFqGf4ANL.a069o2tA0cdGWIduoQien/svMU7AsGnjVtZGfuzixletGkXZSyRhuAqlTqbamSjF5onaWgVZJELSBI81HPgk3FxK8+/ukMh1EDdh70bqgjkIBsTQ6cHjgIYUATQak1DxTm/ur01U0sU/qlbB/g==';
const FOLDER = 'pages';
/* ================================================ */

const SUBJECTS = [
  { key:'deutsch',      label:'Deutsch',      emoji:'🥨', cssClass:'deutsch' },
  { key:'englisch',     label:'Englisch',     emoji:'🫅', cssClass:'englisch' },
  { key:'franzoesisch', label:'Französisch',  emoji:'🥐', cssClass:'franzoesisch' }
];

const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}`;

const homeView = document.getElementById('homeView');
const subjectView = document.getElementById('subjectView');
const subjectGrid = document.getElementById('subjectGrid');
const subtitle = document.getElementById('subtitle');
const subjectEmoji = document.getElementById('subjectEmoji');
const subjectLabel = document.getElementById('subjectLabel');
const backBtn = document.getElementById('backBtn');
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('empty');
const addBtn = document.getElementById('addBtn');
const fileInput = document.getElementById('fileInput');
const adminToggle = document.getElementById('adminToggle');
const statusEl = document.getElementById('status');

/* Der Token wird nur im Arbeitsspeicher gehalten (nicht im Browser gespeichert).
   Nach dem Neuladen der Seite meldest du dich einfach wieder an. */
sessionStorage.removeItem('gh_token'); // alten, früher gespeicherten Token entfernen
let token = null;
let currentSubject = null;

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.style.color = isError ? '#e0507a' : '#888';
}

async function checkAdmin(){
  if(!token) return false;
  try{
    const res = await fetch(`${API_BASE}`, { headers:{ Authorization:`token ${token}` } });
    return res.ok;
  }catch(e){ return false; }
}

async function updateAdminUI(){
  const ok = await checkAdmin();
  addBtn.disabled = !ok;
  adminToggle.textContent = ok ? '🔓 Angemeldet' : '🔐 Admin';
  adminToggle.classList.toggle('active', ok);
  if(!ok && token){ token = null; }
}

adminToggle.addEventListener('click', async () => {
  if(addBtn.disabled && !token){
    const t = await askToken();
    if(!t) return;
    token = t;
    setStatus('Angemeldet ✅');
    updateIndexFile();
    await updateAdminUI();
    if(currentSubject) render();
  } else {
    token = null;
    indexPromise = null; // nach dem Abmelden die Liste neu laden
    await updateAdminUI();
    setStatus('Abgemeldet. Neue Apps sind für Schüler:innen nach 1–2 Minuten sichtbar.');
    if(currentSubject) render();
  }
});

/* ---------- Anmeldung mit Passwort ---------- */
const loginDialog = document.getElementById('loginDialog');
const loginForm   = document.getElementById('loginForm');
const loginInput  = document.getElementById('loginInput');
const loginMsg    = document.getElementById('loginMsg');
document.getElementById('loginCancel').addEventListener('click', () => loginDialog.close());

function b64ToBytes(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

/* Entschlüsselt den Token mit dem Passwort (PBKDF2 + AES-GCM). Falsches Passwort -> Fehler. */
async function decryptToken(password){
  const [v, iter, salt, iv, ct] = ENCRYPTED_TOKEN.trim().split('.');
  if(v !== 'v1') throw new Error('Unbekanntes Format');
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64ToBytes(salt), iterations:Number(iter), hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBytes(iv) }, key, b64ToBytes(ct));
  return new TextDecoder().decode(plain);
}

/* Zeigt das Anmelde-Fenster. Gibt den gültigen Token zurück oder null (abgebrochen). */
function askToken(){
  const withPassword = !!ENCRYPTED_TOKEN.trim();
  loginInput.placeholder = withPassword ? 'Passwort' : 'GitHub-Token';
  loginInput.value = '';
  loginMsg.textContent = '';
  return new Promise(resolve => {
    let done = false;
    const finish = val => { if(done) return; done = true; loginForm.onsubmit = null; loginDialog.onclose = null; loginDialog.close(); resolve(val); };
    loginDialog.onclose = () => finish(null);
    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const input = loginInput.value;
      if(!input) return;
      loginMsg.style.color = '#888';
      loginMsg.textContent = 'Prüfe...';
      let t = null;
      try{ t = withPassword ? await decryptToken(input) : input.trim(); }
      catch(err){ t = null; }
      if(!t){ loginMsg.style.color = ''; loginMsg.textContent = 'Passwort falsch.'; loginInput.select(); return; }
      token = t;
      const ok = await checkAdmin();
      token = null;
      if(!ok){
        loginMsg.style.color = '';
        loginMsg.textContent = withPassword
          ? 'Passwort stimmt, aber der Token ist abgelaufen oder ungültig. Bitte neuen Token verschlüsseln.'
          : 'Token ungültig oder ohne Rechte für dieses Repo.';
        return;
      }
      finish(t);
    };
    loginDialog.showModal();
    loginInput.focus();
  });
}

function getHashSubject(){
  const key = location.hash.replace('#','');
  return SUBJECTS.find(s => s.key === key) || null;
}
window.addEventListener('hashchange', render);
backBtn.addEventListener('click', () => { location.hash = ''; });

function render(){
  const subject = getHashSubject();
  currentSubject = subject;
  if(!subject){
    homeView.style.display = 'block';
    subjectView.style.display = 'none';
    subtitle.textContent = 'Wähle ein Fach aus:';
    renderSubjectCards();
  } else {
    homeView.style.display = 'none';
    subjectView.style.display = 'block';
    subtitle.textContent = `Sammlung: ${subject.label}`;
    subjectEmoji.textContent = subject.emoji;
    subjectLabel.textContent = subject.label;
    loadPages(subject);
  }
}

async function renderSubjectCards(){
  subjectGrid.innerHTML = '';
  for(const subject of SUBJECTS){
    const card = document.createElement('button');
    card.className = `subject-card ${subject.cssClass}`;
    card.innerHTML = `<span class="emoji">${subject.emoji}</span><span>${subject.label}</span><span class="count">lädt...</span>`;
    card.addEventListener('click', () => { location.hash = subject.key; });
    subjectGrid.appendChild(card);

    fetchFolder(subject.key).then(files => {
      const countEl = card.querySelector('.count');
      countEl.textContent = `${files.length} Seite${files.length === 1 ? '' : 'n'}`;
    }).catch(() => {
      card.querySelector('.count').textContent = '–';
    });
  }
}

/* --- Liste der Seiten laden ---
   Schülerinnen und Schüler: liest pages/index.json direkt von GitHub Pages.
   Das zählt NICHT gegen das GitHub-API-Limit (60 Anfragen/Stunde pro IP).
   Admin (mit Token): fragt die API ab, damit neue Uploads sofort sichtbar sind. */
const INDEX_FILE = `${FOLDER}/index.json`;
let indexPromise = null;

function isAdmin(){ return !!token && !addBtn.disabled; }

function loadIndex(){
  if(!indexPromise){
    // Cache-Buster pro 5 Minuten, damit neue Apps bald erscheinen
    const t = Math.floor(Date.now() / 300000);
    indexPromise = fetch(`${INDEX_FILE}?t=${t}`)
      .then(res => { if(!res.ok) throw new Error('index.json nicht gefunden (' + res.status + ')'); return res.json(); })
      .catch(e => { indexPromise = null; throw e; });
  }
  return indexPromise;
}

async function fetchFolderApi(subjectKey){
  // cache:'no-store' verhindert, dass der Browser eine veraltete Ordnerliste (bis 60 s alt) verwendet
  const res = await fetch(`${API_BASE}/contents/${FOLDER}/${subjectKey}?ref=${BRANCH}`,
    token ? { headers:{ Authorization:`token ${token}` }, cache:'no-store' } : { cache:'no-store' });
  if(res.status === 404) return [];
  if(!res.ok) throw new Error('GitHub-API-Fehler ' + res.status + (res.status === 403 || res.status === 429 ? ' (Limit erreicht)' : ''));
  const files = await res.json();
  return files.filter(f => f.type === 'file' && /\.html?$/i.test(f.name));
}

async function fetchFolder(subjectKey){
  if(isAdmin()) return fetchFolderApi(subjectKey);
  const index = await loadIndex();
  return (index[subjectKey] || []).map(f => ({ name: f.name, path: f.path }));
}

async function loadPages(subject){
  setStatus('Lade Seiten...');
  try{
    const htmlFiles = await fetchFolder(subject.key);
    const pages = await Promise.all(htmlFiles.map(async f => {
      // Admin: direkt aus dem Repo (sofort aktuell); sonst: von GitHub Pages (kein Limit)
      const url = (isAdmin() && f.download_url) ? f.download_url : encodeURI(f.path);
      const raw = await fetch(url);
      if(!raw.ok) throw new Error(f.name + ' (' + raw.status + ')');
      const content = await raw.text();
      return { name: f.name, path: f.path, sha: f.sha, content };
    }));
    renderCards(pages);
    setStatus('');
  }catch(e){
    setStatus('Seiten konnten nicht geladen werden: ' + e.message, true);
    renderCards([]);
  }
}

/* Für die Vorschau: Ersatz-Speicher, damit Apps mit localStorage in der Sandbox nicht abstürzen. */
const PREVIEW_SHIM = '<script>(function(){function m(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}' +
  'try{Object.defineProperty(window,"localStorage",{value:m(),configurable:true})}catch(e){}' +
  'try{Object.defineProperty(window,"sessionStorage",{value:m(),configurable:true})}catch(e){}' +
  'window.alert=window.confirm=window.prompt=function(){};})();<\/script>';

/* Öffnet eine App in einem neuen Tab, ohne Verbindung zur Hauptseite ("noopener").
   So bleibt der Token geschützt; der Lernfortschritt (localStorage) funktioniert weiterhin. */
function openApp(page){
  const url = URL.createObjectURL(new Blob([page.content], { type:'text/html;charset=utf-8' }));
  window.open(url, '_blank', 'noopener');
}

function renderCards(pages){
  grid.innerHTML = '';
  emptyMsg.style.display = pages.length ? 'none' : 'block';
  pages.forEach(page => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const iframe = document.createElement('iframe');
    /* Vorschau abgeschottet ("sandbox"): Die App kann nicht auf die Hauptseite
       (und damit nicht auf den Token) zugreifen. */
    iframe.sandbox = 'allow-scripts';
    iframe.srcdoc = PREVIEW_SHIM + page.content;
    thumb.appendChild(iframe);
    thumb.addEventListener('click', () => openApp(page));

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = '📄 ' + page.name.replace(/^\d{13}-/, '');
    body.appendChild(title);

    if(!addBtn.disabled){
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Löschen';
      removeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!confirm(`"${page.name.replace(/^\d{13}-/, '')}" wirklich löschen?`)) return;
        await deleteFile(page);
      });
      body.appendChild(removeBtn);
    }

    card.appendChild(thumb);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

async function deleteFile(page){
  setStatus('Lösche ' + page.name + '...');
  try{
    const res = await fetch(`${API_BASE}/contents/${page.path}`, {
      method:'DELETE',
      headers:{ Authorization:`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message:`Remove ${page.name}`, sha: page.sha, branch: BRANCH })
    });
    if(!res.ok) throw new Error(await res.text());
    await updateIndexFile();
    setStatus('Gelöscht ✅');
    loadPages(currentSubject);
  }catch(e){ setStatus('Löschen fehlgeschlagen: ' + e.message, true); }
}

addBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for(const file of files){ await uploadFile(file); }
  fileInput.value = '';
  await updateIndexFile();
  loadPages(currentSubject);
});

function toBase64(str){ return btoa(unescape(encodeURIComponent(str))); }

/* Schreibt pages/index.json neu (nur Admin). Diese Datei lesen die Schülerinnen und Schüler. */
async function updateIndexFile(){
  if(!token) return;
  try{
    const index = {};
    for(const s of SUBJECTS){
      const files = await fetchFolderApi(s.key);
      index[s.key] = files.map(f => ({ name: f.name, path: f.path }));
    }
    const body = { message:'Update index.json', content: toBase64(JSON.stringify(index, null, 2) + '\n'), branch: BRANCH };
    const headers = { Authorization:`token ${token}`, 'Content-Type':'application/json' };
    const cur = await fetch(`${API_BASE}/contents/${INDEX_FILE}?ref=${BRANCH}`, { headers, cache:'no-store' });
    if(cur.ok){ body.sha = (await cur.json()).sha; }
    const res = await fetch(`${API_BASE}/contents/${INDEX_FILE}`, { method:'PUT', headers, body: JSON.stringify(body) });
    if(!res.ok) throw new Error(await res.text());
    indexPromise = null; // beim nächsten Laden die neue Liste holen
  }catch(e){ alert('Achtung: index.json konnte nicht aktualisiert werden. Die Schülerinnen und Schüler sehen die Änderung evtl. nicht.\n\n' + e.message); }
}

async function uploadFile(file){
  setStatus('Lade hoch: ' + file.name + '...');
  const content = await file.text();
  const safeName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  try{
    const res = await fetch(`${API_BASE}/contents/${FOLDER}/${currentSubject.key}/${safeName}`, {
      method:'PUT',
      headers:{ Authorization:`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message: `Add ${safeName} (${currentSubject.label})`, content: toBase64(content), branch: BRANCH })
    });
    if(!res.ok) throw new Error(await res.text());
    setStatus('Hochgeladen ✅');
  }catch(e){ setStatus('Upload fehlgeschlagen: ' + e.message, true); }
}

(async function init(){
  await updateAdminUI();
  render();
})();
</script>
</body>
</html>
