<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open World 1 – Unit 2 · Grammar Check</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e1d8;
  --accent:#0f766e; --accent-soft:#d9f0ec; --warm:#c2410c; --warm-soft:#fdeee4;
  --ok:#15803d; --ok-soft:#e3f5e8; --bad:#b91c1c; --bad-soft:#fde8e8; --tip:#a16207; --tip-soft:#fef6db;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:17px}
header{background:var(--accent);color:#fff;padding:18px 20px 0}
header h1{margin:0;font-size:1.35rem;font-weight:700}
header p{margin:2px 0 12px;opacity:.85;font-size:.95rem}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:rgba(255,255,255,.14);color:#fff;padding:9px 14px;border-radius:10px 10px 0 0;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap}
nav button.active{background:var(--bg);color:var(--accent);font-weight:700}
nav button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:rgba(255,255,255,.35);vertical-align:middle}
nav button.active .dot{background:var(--line)}
nav button .dot.done{background:#86efac}
main{max-width:880px;margin:0 auto;padding:22px 16px 60px}
section{display:none}
section.show{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
h2{font-size:1.3rem;margin:0 0 4px}
h3{font-size:1.08rem;margin:0 0 10px}
.lz{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;margin-bottom:14px}
.muted{color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.bank span{background:var(--warm-soft);color:var(--warm);border-radius:8px;padding:2px 10px;font-weight:600;font-size:.95rem}
.row{padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.para{line-height:2.35}
input.gap{font:inherit;border:0;border-bottom:2px solid #9ca3af;background:#fafaf8;padding:1px 6px;width:9.5em;max-width:100%;border-radius:4px 4px 0 0}
input.gap.short{width:5.5em}
input.full{font:inherit;width:100%;border:1.5px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fafaf8;margin-top:4px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.prompt{font-weight:500}
.prompt .who{font-weight:700;color:var(--accent)}
.num{display:inline-block;font-size:.7rem;font-weight:700;background:var(--line);color:var(--muted);border-radius:6px;padding:0 5px;margin-right:3px;vertical-align:super;line-height:1.4}
.choice{display:inline-flex;gap:4px;vertical-align:middle}
.opt{font:inherit;font-size:.95rem;border:1.5px solid #cbd5e1;background:#fff;border-radius:8px;padding:1px 10px;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.is-ok input,.is-ok .opt.sel,.is-ok .built{border-color:var(--ok)!important;background:var(--ok-soft)!important;color:var(--ok)}
.is-bad input,.is-bad .opt.sel,.is-bad .built{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.is-rev input,.is-rev .opt.sel,.is-rev .built{border-color:var(--bad)!important;background:var(--bad-soft)!important;text-decoration:line-through;color:var(--bad)}
input:disabled,.opt:disabled{cursor:default}
.order .built{min-height:42px;border:1.5px dashed #94a3b8;border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;background:#fafaf8}
.order .built:empty::before{content:"Tippe die Wörter in der richtigen Reihenfolge an …";color:#9ca3af;font-size:.92rem}
.tiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile{font:inherit;font-size:.95rem;border:0;background:var(--warm-soft);color:#7c2d12;border-radius:8px;padding:4px 11px;cursor:pointer}
.tile.used{opacity:.25;cursor:default}
.built .tile{background:var(--accent-soft);color:var(--accent)}
.undo{font:inherit;font-size:.85rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.fb{margin-top:6px;font-size:.93rem;border-radius:8px;padding:7px 11px;line-height:1.45}
.fb:empty{display:none}
.fb.tip{background:var(--tip-soft);color:#713f12;border-left:4px solid var(--tip)}
.fb.ok{background:var(--ok-soft);color:var(--ok);border-left:4px solid var(--ok)}
.fb.rev{background:var(--bad-soft);color:#7f1d1d;border-left:4px solid var(--bad)}
.fb.empty{background:#f1f5f9;color:var(--muted)}
.fb b.sol{color:var(--ok);background:#fff;padding:0 5px;border-radius:5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500}
.score{font-weight:600;color:var(--accent)}
.next{display:flex;justify-content:flex-end}
/* theory */
details{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:1.05rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent)}
details[open] summary::before{content:"▾ "}
.th{padding:0 18px 16px}
table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);color:var(--accent)}
.ex{background:#f8fafc;border-left:4px solid var(--accent);padding:6px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.rule{background:var(--warm-soft);border-radius:8px;padding:8px 12px;margin:8px 0;font-weight:500}
.hl{color:var(--warm);font-weight:700}
/* results */
.res-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:12px;background:#eef2f1;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.badge{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:99px;text-align:center}
.b0{background:#f1f5f9;color:var(--muted)}.b1{background:var(--bad-soft);color:var(--bad)}.b2{background:var(--tip-soft);color:var(--tip)}.b3{background:var(--accent-soft);color:var(--accent)}.b4{background:var(--ok-soft);color:var(--ok)}
.lzres-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:-4px 0 14px;font-weight:600;font-size:.95rem}
ul.goals{padding-left:1.1em}
ul.goals li{margin:4px 0}
@media (max-width:560px){body{font-size:16px}.res-row{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<header>
  <h1>Open World 1 · Unit 2 – Grammar Check</h1>
  <p>Formative Lernkontrolle: üben, Tipps bekommen, aus Fehlern lernen</p>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
/* ---------------------------------------------------------------
   INHALTE
   Item-Typen:  gap (Lücke) · choice (Auswahl) · write (Satz schreiben) · order (Wörter ordnen)
   a = akzeptierte Lösungen (die erste wird angezeigt), h = Tipp, e = Erklärung
---------------------------------------------------------------- */
const EX = [
{ id:"pp", short:"1 Pronouns", title:"1 · Personal pronouns", lz:"Ich kann Personalpronomen richtig anwenden.", tasks:[
  { id:"pp-a", title:"a) Complete the dialogues. Use the object pronouns.", bank:["me","you","him","her","it","us","them"], rows:[
    ["Do you like my new trainers? – Yes, I love ",{t:"gap",a:["them"],h:"„Trainers“ sind mehrere Dinge. Welches Objektpronomen gehört zu „they“?",e:"„my new trainers“ = Mehrzahl (they). Nach dem Verb steht die Objektform: they → <b>them</b>."},"."],
    ["Where is your bike? – My brother has got ",{t:"gap",a:["it"],h:"Ein Fahrrad ist ein Ding (Einzahl).",e:"Für ein Ding in der Einzahl: it → <b>it</b> (Subjekt- und Objektform sind gleich)."},"."],
    ["This is Mr Brown, our new teacher. Do you know ",{t:"gap",a:["him"],h:"Mr Brown ist ein Mann. Was ist die Objektform von „he“?",e:"Mr Brown = he. Objektform: he → <b>him</b>."},"?"],
    ["I don't understand my homework. Can you help ",{t:"gap",a:["me"],h:"Wer braucht Hilfe? Die Person, die spricht (I).",e:"Die sprechende Person ist „I“. Objektform: I → <b>me</b>."},"?"],
    ["Grandma is in hospital. We visit ",{t:"gap",a:["her"],h:"Grandma = she. Wie lautet die Objektform?",e:"Grandma = she. Objektform: she → <b>her</b>."}," every Sunday."],
    ["Emma and I love our dog. He always plays with ",{t:"gap",a:["us"],h:"„Emma and I“ = we. Was steht nach „with“?",e:"„Emma and I“ = we. Nach einer Präposition (with) steht die Objektform: we → <b>us</b>."}," in the garden."],
    ["Look, there are whales in the sea! Can you see ",{t:"gap",a:["them"],h:"„whales“ ist Mehrzahl.",e:"Whales = they. Objektform: they → <b>them</b>."},"?"],
    ["Tom and Lisa, this cake is for ",{t:"gap",a:["you"],h:"Man spricht Tom und Lisa direkt an.",e:"Wenn man Personen direkt anspricht: you → <b>you</b> (Einzahl und Mehrzahl gleich)."},". Enjoy it!"]
  ]},
  { id:"pp-b", title:"b) Subject or object? Click the correct word.", rows:[
    [{t:"choice",o:["I","Me"],a:0,h:"Das Wort steht vor dem Verb „have got“ – es ist das Subjekt.",e:"Vor dem Verb steht das Subjekt: <b>I</b> have got a dog."}," have got a dog. ",{t:"choice",o:["He","Him"],a:0,h:"Wer ist sehr freundlich? Das Wort steht vor dem Verb „is“.",e:"Subjekt vor dem Verb: <b>He</b> is very friendly."}," is very friendly."],
    ["My grandma lives in Zurich. We often visit ",{t:"choice",o:["she","her"],a:1,h:"Das Wort steht nach dem Verb „visit“.",e:"Nach dem Verb steht die Objektform: she → <b>her</b>."},"."],
    ["Where are Tom and Lisa? I can't find ",{t:"choice",o:["they","them"],a:1,h:"Das Wort steht nach dem Verb „find“.",e:"Nach dem Verb steht die Objektform: they → <b>them</b>."},"."],
    ["Can you help ",{t:"choice",o:["we","us"],a:1,h:"Nach „help“ steht ein Objekt.",e:"Objektform von we: <b>us</b>."},"? – Sure, ",{t:"choice",o:["I","me"],a:0,h:"Das Wort steht vor dem Verb „can help“.",e:"Vor dem Verb steht das Subjekt: <b>I</b> can help you."}," can help you."]
  ]}
]},
{ id:"q", short:"2 Questions", title:"2 · Questions and short answers", lz:"Ich kann korrekte Fragen (mit und ohne Fragewort) und kurze Antworten formulieren.", tasks:[
  { id:"q-a", title:"a) Sam asks Lea about her family. Write questions with do or does. Then write short answers (✓ = yes, ✗ = no).", rows:[
    [{t:"write",p:"<span class='who'>Sam</span> (you | play | an instrument)",a:["Do you play an instrument?"],h:"Fragen im Simple Present: Do/Does + Subjekt + Verb …? Bei „you“ nimmt man …",e:"Bei I/you/we/they: <b>Do</b> + Subjekt + Grundform des Verbs."}],
    [{t:"write",p:"<span class='who'>Lea</span> (✓)",a:["Yes, I do."],h:"Kurzantwort: Yes, + Pronomen + Hilfsverb. Lea spricht über sich selbst.",e:"Auf „Do you …?“ antwortet man mit <b>Yes, I do.</b> (nicht „Yes, I play.“)."}],
    [{t:"write",p:"<span class='who'>Sam</span> (your brother | play | an instrument)",a:["Does your brother play an instrument?"],h:"„your brother“ = he. Bei he/she/it braucht es ein anderes Hilfsverb.",e:"Bei he/she/it: <b>Does</b> + Subjekt + Grundform (ohne -s): Does your brother <b>play</b> …?"}],
    [{t:"write",p:"<span class='who'>Lea</span> (✗)",a:["No, he doesn't.","No, he does not."],h:"Ersetze „your brother“ durch ein Pronomen. Verneinte Kurzform von „does“?",e:"your brother = he → <b>No, he doesn't.</b>"}],
    [{t:"write",p:"<span class='who'>Sam</span> (your parents | like | music)",a:["Do your parents like music?"],h:"„your parents“ = they.",e:"they → <b>Do</b>: Do your parents like music?"}],
    [{t:"write",p:"<span class='who'>Lea</span> (✓)",a:["Yes, they do."],h:"Ersetze „your parents“ durch ein Pronomen.",e:"your parents = they → <b>Yes, they do.</b>"}],
    [{t:"write",p:"<span class='who'>Sam</span> (your cat | sleep | on your bed)",a:["Does your cat sleep on your bed?"],h:"„your cat“ = it. Und: kein -s beim Verb, wenn „does“ schon da ist!",e:"it → <b>Does</b> your cat <b>sleep</b> on your bed? (sleep ohne -s)"}],
    [{t:"write",p:"<span class='who'>Lea</span> (✗)",a:["No, it doesn't.","No, it does not."],h:"Eine Katze ist „it“.",e:"your cat = it → <b>No, it doesn't.</b>"}]
  ]},
  { id:"q-b", title:"b) Write short answers. Look at the verb in the question!", rows:[
    ["Are you at home? (✗) ",{t:"gap",a:["No, I'm not.","No, I am not."],h:"Die Frage beginnt mit „Are“. Die Antwort braucht eine Form von „be“.",e:"Are you …? → <b>No, I'm not.</b> (nicht „No, I amn't“!)"}],
    ["Has she got a pet? (✓) ",{t:"gap",a:["Yes, she has."],h:"Wiederhole das Hilfsverb aus der Frage.",e:"Has she got …? → <b>Yes, she has.</b>"}],
    ["Can your dog swim? (✓) ",{t:"gap",a:["Yes, it can."],h:"Ein Hund ist „it“. Welches Hilfsverb steht in der Frage?",e:"Can your dog …? → <b>Yes, it can.</b>"}],
    ["Is Tom in the garden? (✗) ",{t:"gap",a:["No, he isn't.","No, he is not.","No, he's not."],h:"Tom = he. Die Frage beginnt mit „Is“.",e:"Is Tom …? → <b>No, he isn't.</b>"}],
    ["Does your sister like horses? (✓) ",{t:"gap",a:["Yes, she does."],h:"your sister = she. Hilfsverb aus der Frage wiederholen.",e:"Does your sister …? → <b>Yes, she does.</b>"}]
  ]},
  { id:"q-c", title:"c) Write the questions. Add a question word: what, where, when, why, how or who.", rows:[
    [{t:"write",p:"(you | get up | in the morning)? – <i>I get up at 7 o'clock.</i>",a:["When do you get up in the morning?","What time do you get up in the morning?"],h:"Die Antwort nennt eine Zeit. Reihenfolge: Fragewort + do/does + Subjekt + Verb …",e:"Zeit → <b>When</b>. Fragewort + do + Subjekt + Verb: When do you get up in the morning?"}],
    [{t:"write",p:"(your grandparents | live)? – <i>They live in Bern.</i>",a:["Where do your grandparents live?"],h:"Die Antwort nennt einen Ort.",e:"Ort → <b>Where</b>: Where do your grandparents live?"}],
    [{t:"write",p:"(you | usually have | for breakfast)? – <i>I usually have cornflakes.</i>",a:["What do you usually have for breakfast?"],h:"Die Antwort nennt eine Sache. Das Adverb „usually“ steht vor dem Hauptverb.",e:"Sache → <b>What</b>: What do you usually have for breakfast?"}],
    [{t:"write",p:"(Ben | go | to school)? – <i>He goes by bus.</i>",a:["How does Ben go to school?"],h:"Die Antwort sagt, auf welche Art. Und: Ben = he → does!",e:"Art und Weise → <b>How</b>. Ben = he → <b>does</b>; das Verb bleibt in der Grundform: How does Ben go to school?"}],
    [{t:"write",p:"(you | like | dogs)? – <i>Because they are friendly.</i>",a:["Why do you like dogs?"],h:"Die Antwort beginnt mit „Because“.",e:"Grund → <b>Why</b>: Why do you like dogs?"}],
    [{t:"write",p:"(we | can meet)? – <i>We can meet at the station.</i>",a:["Where can we meet?"],h:"Hier steht schon ein Hilfsverb (can). Dann braucht es kein „do“!",e:"Mit can: Fragewort + <b>can</b> + Subjekt + Verb: <b>Where can we meet?</b> (kein do!)"}]
  ]}
]},
{ id:"adv", short:"3 Adverbs", title:"3 · Adverbs of frequency", lz:"Ich kann korrekte Sätze mit den Adverbien der Häufigkeit bilden.", tasks:[
  { id:"adv-a", title:"a) What do people do on Saturdays? Write the sentences with the word in brackets.", rows:[
    [{t:"write",p:"I eat breakfast in bed. (never)",a:["I never eat breakfast in bed."],h:"Einwort-Adverbien stehen vor dem Hauptverb.",e:"Das Adverb steht <b>vor dem Hauptverb</b> (eat): I <b>never</b> eat breakfast in bed."}],
    [{t:"write",p:"My sister is late for her dance class. (often)",a:["My sister is often late for her dance class."],h:"Achtung: Das Verb ist eine Form von „to be“.",e:"Bei <b>to be</b> (am/is/are) steht das Adverb <b>nach</b> dem Verb: My sister is <b>often</b> late …"}],
    [{t:"write",p:"We go to the swimming pool. (usually)",a:["We usually go to the swimming pool."],h:"Wo steht das Adverb bei einem normalen Verb?",e:"Vor dem Hauptverb: We <b>usually</b> go to the swimming pool."}],
    [{t:"write",p:"Our dog is tired in the evening. (always)",a:["Our dog is always tired in the evening."],h:"Schau dir das Verb genau an: „is“.",e:"Nach einer Form von to be: Our dog is <b>always</b> tired …"}],
    [{t:"write",p:"My dad cooks pizza. (sometimes)",a:["My dad sometimes cooks pizza."],h:"Das Adverb kommt vor das Hauptverb „cooks“.",e:"Vor dem Hauptverb: My dad <b>sometimes</b> cooks pizza."}]
  ]},
  { id:"adv-b", title:"b) Mia talks about her week. Put the words in the correct order.", rows:[
    [{t:"order",w:["usually","the bus","I","take","to school"],a:["I usually take the bus to school"],h:"Satzbau: Subjekt – Adverb – Verb – Rest.",e:"Subjekt (I) + Adverb (usually) + Verb (take) + Rest: <b>I usually take the bus to school.</b>"}],
    [{t:"order",w:["every day","feeds","my brother","our cat"],a:["My brother feeds our cat every day"],h:"„every day“ besteht aus mehreren Wörtern. Wohin gehören solche Ausdrücke?",e:"Mehrwortige Häufigkeitsangaben stehen <b>am Satzende</b>: My brother feeds our cat <b>every day</b>."}],
    [{t:"order",w:["on Sundays","never","we","go","to school"],a:["We never go to school on Sundays","On Sundays we never go to school"],h:"„never“ steht vor dem Verb, „on Sundays“ am Ende.",e:"<b>We never go to school on Sundays.</b> – never vor dem Verb, die Zeitangabe am Satzende (oder am Satzanfang)."}],
    [{t:"order",w:["are","my friends","always","at the park","after school"],a:["My friends are always at the park after school","After school my friends are always at the park"],h:"Das Verb ist „are“ (to be). Wo steht dann das Adverb?",e:"Nach to be: <b>My friends are always at the park after school.</b>"}],
    [{t:"order",w:["three times a week","plays","Mia","football"],a:["Mia plays football three times a week"],h:"Mehrwortige Häufigkeitsangaben kommen ans Ende.",e:"<b>Mia plays football three times a week.</b>"}]
  ]}
]},
{ id:"pc", short:"4 Pres. continuous", title:"4 · Present continuous", lz:"Ich kann Sätze, Fragen und Antworten im Present Continuous bilden.", tasks:[
  { id:"pc-a", title:"a) Spelling: Write the -ing form.", rows:[
    ["play → ",{t:"gap",a:["playing"],h:"Normale Verben: einfach -ing anhängen.",e:"play + ing = <b>playing</b>"}],
    ["write → ",{t:"gap",a:["writing"],h:"Das Verb endet auf -e.",e:"Stummes -e fällt weg: write → <b>writing</b>"}],
    ["swim → ",{t:"gap",a:["swimming"],h:"Kurzer betonter Vokal + Konsonant am Ende …",e:"Kurzer betonter Vokal + Konsonant → Konsonant verdoppeln: <b>swimming</b>"}],
    ["lie → ",{t:"gap",a:["lying"],h:"Das Verb endet auf -ie.",e:"-ie wird zu -y: <b>lying</b>"}],
    ["make → ",{t:"gap",a:["making"],h:"Was passiert mit dem -e am Ende?",e:"-e fällt weg: <b>making</b>"}],
    ["get → ",{t:"gap",a:["getting"],h:"Kurzer betonter Vokal + Konsonant.",e:"Konsonant verdoppeln: <b>getting</b>"}]
  ]},
  { id:"pc-b", title:"b) It's Saturday afternoon in the park. What is happening right now? Write sentences.", rows:[
    [{t:"write",p:"(Ben | ride | his bike)",a:["Ben is riding his bike."],h:"Form: am/is/are + Verb-ing. Ben = he. Achtung Spelling von ride!",e:"he → <b>is</b> + ride → rid<b>ing</b> (-e fällt weg): Ben is riding his bike."}],
    [{t:"write",p:"(the girls | swim | in the lake)",a:["The girls are swimming in the lake."],h:"„the girls“ = they → welche Form von „be“? Spelling von swim!",e:"they → <b>are</b>; swim → swi<b>mm</b>ing: The girls are swimming in the lake."}],
    [{t:"write",p:"(I | sit | on a bench)",a:["I am sitting on a bench.","I'm sitting on a bench."],h:"I → am. Spelling von sit?",e:"I → <b>am</b>; sit → si<b>tt</b>ing: I'm sitting on a bench."}],
    [{t:"write",p:"(the cat | lie | in the sun)",a:["The cat is lying in the sun."],h:"Verben auf -ie haben eine besondere Schreibweise.",e:"it → <b>is</b>; lie → l<b>y</b>ing: The cat is lying in the sun."}],
    [{t:"write",p:"(Mr and Mrs Smith | not | play | tennis)",a:["Mr and Mrs Smith aren't playing tennis.","Mr and Mrs Smith are not playing tennis."],h:"Verneinung: am/is/are + not + Verb-ing.",e:"they → <b>are not / aren't</b> + playing."}]
  ]},
  { id:"pc-c", title:"c) Write questions in the present continuous and short answers.", rows:[
    [{t:"write",p:"(Tom | read | a book)?",a:["Is Tom reading a book?"],h:"Fragen: Am/Is/Are + Subjekt + Verb-ing …?",e:"Tom = he → <b>Is</b> Tom read<b>ing</b> a book?"}],
    [{t:"write",p:"(✗)",a:["No, he isn't.","No, he is not.","No, he's not."],h:"Kurzantwort: No, + Pronomen + Form von be + not.",e:"Tom = he → <b>No, he isn't.</b>"}],

/* --------------------------- THEORIE --------------------------- */
const THEORY = `
<div class="card"><h2>Theorie</h2><p class="muted">Klicke ein Thema an, um es aufzuklappen. Du kannst jederzeit hierher zurückkommen.</p></div>

<details open><summary>1 · Personal pronouns (Personalpronomen)</summary><div class="th">
<table><tr><th>Subjektform</th><th>Objektform</th><th>Deutsch</th></tr>
<tr><td>I</td><td>me</td><td>ich – mich/mir</td></tr>
<tr><td>you</td><td>you</td><td>du – dich/dir</td></tr>
<tr><td>he</td><td>him</td><td>er – ihn/ihm</td></tr>
<tr><td>she</td><td>her</td><td>sie – sie/ihr</td></tr>
<tr><td>it</td><td>it</td><td>es – es/ihm</td></tr>
<tr><td>we</td><td>us</td><td>wir – uns</td></tr>
<tr><td>you</td><td>you</td><td>ihr – euch</td></tr>
<tr><td>they</td><td>them</td><td>sie – sie/ihnen</td></tr></table>
<div class="rule"><span class="hl">Subjektform</span> → steht <b>vor dem Verb</b> (wer macht etwas?).<br><span class="hl">Objektform</span> → steht <b>nach dem Verb</b> oder nach einer <b>Präposition</b> (with, for, to, at …).</div>
<div class="ex"><b>She</b> likes Tom. – Tom likes <b>her</b>.<br><b>We</b> play with the dog. – The dog plays with <b>us</b>.</div>
<p>Tipp: Ersetze zuerst das Nomen: <i>my shoes</i> → they → them; <i>Mr Brown</i> → he → him.</p>
</div></details>

<details><summary>2 · Questions and short answers (Fragen und Kurzantworten)</summary><div class="th">
<h3>Ja/Nein-Fragen im Simple Present</h3>
<div class="rule"><b>Do / Does</b> + Subjekt + <b>Grundform</b> des Verbs + Rest?</div>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><b>Do</b> you like cats?</td><td><b>Does</b> she like cats? <span class="muted">(nicht: likes!)</span></td></tr></table>
<p>Bei <b>be</b>, <b>can</b> und <b>have got</b> braucht es kein do: <i>Are you …? Can you …? Has she got …?</i></p>
<h3>Kurzantworten</h3>
<div class="rule">Yes / No + <b>Pronomen</b> + <b>Hilfsverb aus der Frage</b></div>
<table><tr><th>Frage</th><th>✓</th><th>✗</th></tr>
<tr><td>Do you know the answer?</td><td>Yes, I do.</td><td>No, I don't.</td></tr>
<tr><td>Does Tom play tennis?</td><td>Yes, he does.</td><td>No, he doesn't.</td></tr>
<tr><td>Has she got a pet?</td><td>Yes, she has.</td><td>No, she hasn't.</td></tr>
<tr><td>Are they at home?</td><td>Yes, they are.</td><td>No, they aren't.</td></tr>
<tr><td>Are you OK?</td><td>Yes, I am.</td><td>No, I'm not.</td></tr>
<tr><td>Can your dog swim?</td><td>Yes, it can.</td><td>No, it can't.</td></tr></table>
<p>Achtung: Positive Kurzantworten nie zusammenziehen: <i>Yes, I am.</i> (nicht „Yes, I'm.“)</p>
<h3>Fragen mit Fragewort (wh-questions)</h3>
<div class="rule">Fragewort + <b>do/does</b> (oder can/is/are …) + Subjekt + Verb + Rest?</div>
<table><tr><th>Fragewort</th><th>Deutsch</th><th>Beispiel</th></tr>
<tr><td>what</td><td>was</td><td>What is your favourite animal?</td></tr>
<tr><td>where</td><td>wo / wohin</td><td>Where do you live?</td></tr>
<tr><td>when</td><td>wann</td><td>When do you feed your dog?</td></tr>
<tr><td>why</td><td>warum</td><td>Why does she like whales?</td></tr>
<tr><td>how</td><td>wie</td><td>How do you get to school?</td></tr>
<tr><td>who</td><td>wer</td><td>Who is your teacher?</td></tr>
<tr><td>which</td><td>welche/r/s</td><td>Which dog is yours?</td></tr></table>
<div class="ex">Where <b>can</b> we meet? <span class="muted">(mit can: kein do)</span></div>
</div></details>

<details><summary>3 · Adverbs of frequency (Adverbien der Häufigkeit)</summary><div class="th">
<p>Sie sagen, <b>wie oft</b> man etwas macht.</p>
<table><tr><th>100 %</th><th></th><th></th><th></th><th></th><th>0 %</th></tr>
<tr><td>always</td><td>usually</td><td>often</td><td>sometimes</td><td>rarely</td><td>never</td></tr></table>
<h3>Ein Wort</h3>
<div class="rule">Einwort-Adverbien stehen <b>vor dem Hauptverb</b>.</div>
<div class="ex">I <b>always</b> get up at 7. – She <b>regularly</b> walks her dog.</div>
<div class="rule">Ausnahme: Ist das Verb eine Form von <b>to be</b> (am, is, are), steht das Adverb <b>danach</b>.</div>
<div class="ex">He is <b>often</b> at the zoo. – We are <b>never</b> late.</div>
<h3>Mehrere Wörter</h3>
<div class="rule">Häufigkeitsangaben aus <b>mehreren Wörtern</b> stehen <b>am Satzende</b>.</div>
<div class="ex">I go to the zoo <b>every year</b>. – I feed my pet <b>three times a day</b>.</div>
<p>Satzbau-Merkhilfe: <b>Subjekt – Adverb – Verb – Objekt – Ort – Zeit</b></p>
</div></details>

<details><summary>4 · Present continuous (Verlaufsform)</summary><div class="th">
<h3>Gebrauch</h3>
<p>Für Dinge, die <b>genau jetzt / im Moment</b> passieren.</p>
<p>Signalwörter: <span class="hl">now, right now, at the moment, today, Look! Listen!</span></p>
<h3>Form</h3>
<div class="rule">am / is / are + Verb<b>-ing</b></div>
<table><tr><th>+</th><th>–</th><th>?</th><th>Kurzantwort</th></tr>
<tr><td>I'm reading.</td><td>I'm not reading.</td><td>Am I reading?</td><td>Yes, I am. / No, I'm not.</td></tr>
<tr><td>He's reading.</td><td>He isn't reading.</td><td>Is he reading?</td><td>Yes, he is. / No, he isn't.</td></tr>
<tr><td>They're reading.</td><td>They aren't reading.</td><td>Are they reading?</td><td>Yes, they are. / No, they aren't.</td></tr></table>
<h3>Spelling</h3>
<table><tr><th>Regel</th><th>Beispiele</th></tr>
<tr><td>Normalfall: + -ing</td><td>talk → talking, play → playing</td></tr>
<tr><td>Endet auf stummes -e: <b>e weg</b> + -ing</td><td>take → taking, write → writing</td></tr>
<tr><td>Kurzer betonter Vokal + Konsonant: <b>Konsonant verdoppeln</b> + -ing</td><td>stop → stopping, run → running, swim → swimming</td></tr>
<tr><td>Endet auf -ie: <b>-ie → y</b> + -ing</td><td>lie → lying, die → dying</td></tr></table>
<h3>Ausnahmen</h3>
<p>Diese Verben stehen normalerweise <b>nicht</b> im Present Continuous:<br>
<span class="hl">like, love, hate, want, need, know, understand, remember, mean, seem, belong, see, be</span></p>
<div class="ex">I <b>want</b> an ice cream now. <span class="muted">(nicht: I'm wanting)</span></div>
</div></details>

<details><summary>5 · Simple present oder present continuous?</summary><div class="th">
<table><tr><th>Simple present</th><th>Present continuous</th></tr>
<tr><td>Gewohnheiten, Dinge, die <b>regelmässig</b> passieren, Tatsachen</td><td>Dinge, die <b>jetzt gerade</b> passieren</td></tr>
<tr><td>always, usually, often, sometimes, never, every day, on Mondays, twice a week …</td><td>now, right now, at the moment, today, Look! Listen!</td></tr>
<tr><td>Ryan usually <b>wears</b> blue.</td><td>Today he <b>is wearing</b> green.</td></tr>
<tr><td>he/she/it → Verb + <b>-s</b></td><td>am/is/are + Verb<b>-ing</b></td></tr></table>
<h3>Alle Formen auf einen Blick</h3>
<table><tr><th></th><th>Simple present</th><th>Present continuous</th></tr>
<tr><td>?</td><td>Does Ben usually read comics?</td><td>Is Ben reading comics now?</td></tr>
<tr><td>+</td><td>Ben usually reads comics.</td><td>Ben is reading comics now.</td></tr>
<tr><td>–</td><td>Ben doesn't usually read comics.</td><td>Ben isn't reading comics now.</td></tr></table>
<p>Tipp: Such zuerst das <b>Signalwort</b> im Satz. Und denk an die Ausnahmeverben (like, love, want, know …) – die bleiben im Simple Present.</p>
</div></details>
`;

const S = {};          // Zustand pro Item
const ITEMS = {};      // id -> item
const TASK_ITEMS = {}; // taskId -> [ids]

EX.forEach(ex => ex.tasks.forEach(t => {
  let n = 0; TASK_ITEMS[t.id] = [];
  t.rows.forEach(r => r.forEach(seg => {
    if (typeof seg === "object") {
      n++; seg.id = t.id + "-" + n; seg.n = n; seg.ex = ex.id;
      ITEMS[seg.id] = seg; TASK_ITEMS[t.id].push(seg.id);
      S[seg.id] = {tries:0, status:"open", sel:null, built:[]};
    }
  }));
}));

const CONTR = {"isn't":"is not","aren't":"are not","don't":"do not","doesn't":"does not","can't":"can not","cannot":"can not","i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","hasn't":"has not","haven't":"have not","anna's":"anna is"};
function norm(s){
  s = (s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"]/g," ").replace(/\s+/g," ").trim();
  return s.split(" ").map(w => CONTR[w] || w).join(" ");
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function itemHTML(it, multi){
  const num = multi ? `<span class="num">${it.n}</span>` : "";
  const id = it.id;
  if (it.t === "gap") {
    const short = Math.max(...it.a.map(a=>a.length)) < 8 ? " short" : "";
    return `<span class="item" id="w-${id}">${num}<input class="gap${short}" data-id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`;
  }
  if (it.t === "choice") {
    return `<span class="item" id="w-${id}">${num}<span class="choice">${it.o.map((o,i)=>`<button class="opt" data-id="${id}" data-i="${i}">${o}</button>`).join("")}</span></span>`;
  }
  if (it.t === "write") {
    return `<div class="item" id="w-${id}"><div class="prompt">${it.p}</div><input class="full" data-id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
  }
  if (it.t === "order") {
    return `<div class="item order" id="w-${id}"><div class="built" id="b-${id}"></div><div class="tiles">${it.w.map((w,i)=>`<button class="tile" data-id="${id}" data-i="${i}">${w}</button>`).join("")}<button class="undo" data-undo="${id}">↺ zurück</button></div></div>`;
  }
}

function getVal(id){
  const it = ITEMS[id], st = S[id];
  if (it.t==="choice") return st.sel;
  if (it.t==="order") return st.built.map(i=>it.w[i]).join(" ");
  return document.querySelector(`input[data-id="${id}"]`).value;
}
function isEmpty(id){
  const it = ITEMS[id], v = getVal(id);
  if (it.t==="choice") return v===null;
  if (it.t==="order") return S[id].built.length < it.w.length;
  return !v.trim();
}
function isRight(id){
  const it = ITEMS[id], v = getVal(id);
  if (it.t==="choice") return v===it.a;
  return it.a.some(a => norm(a)===norm(v));
}
function solution(it){ return it.t==="choice" ? it.o[it.a] : it.a[0]; }

function lock(id){
  document.querySelectorAll(`[data-id="${id}"], [data-undo="${id}"]`).forEach(el=>el.disabled=true);
}

/* Rückmeldung zum aktuellen Zustand eines Items anzeigen */
function paint(id, fresh){
  const st = S[id], it = ITEMS[id];
  const w = document.getElementById("w-"+id), fb = document.getElementById("fb-"+id);
  const pre = w.querySelector(".num") ? `(${it.n}) ` : "";
  w.classList.remove("is-ok","is-bad","is-rev");
  if (st.status === "ok") {
    w.classList.add("is-ok"); fb.className="fb ok";
    fb.innerHTML = pre + (st.pts===1 ? "✓ Richtig!" : "✓ Richtig – gut korrigiert!");
    lock(id);
  } else if (st.status === "rev") {
    w.classList.add("is-rev"); fb.className="fb rev";
    fb.innerHTML = pre + `✗ Richtige Lösung: <b class="sol">${solution(it)}</b><br>${it.e}`;
    lock(id);
  } else if (st.tries >= 1) {
    if (fresh) w.classList.add("is-bad");
    fb.className="fb tip";
    fb.innerHTML = pre + "💡 <b>Tipp:</b> " + it.h;
  } else { fb.className="fb"; fb.innerHTML=""; }
}

function check(tid){
  TASK_ITEMS[tid].forEach(id => {
    const st = S[id], it = ITEMS[id];
    if (st.status !== "open") return;
    if (isEmpty(id)) {
      const w = document.getElementById("w-"+id), fb = document.getElementById("fb-"+id);
      const pre = w.querySelector(".num") ? `(${it.n}) ` : "";
      fb.className="fb empty"; fb.innerHTML = pre + (it.t==="order"?"Benutze alle Wörter.":"Noch nicht ausgefüllt."); return;
    }
    if (isRight(id)) { st.status = "ok"; st.pts = st.tries===0 ? 1 : 0.5; }
    else { st.tries++; if (st.tries >= 2) { st.status = "rev"; st.pts = 0; } }
    paint(id, true);
  });
  updateScore(tid);
  save();
}

/* --------------------------- SPEICHERN --------------------------- */
const KEY = "openworld1-unit2-grammar-v1";
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}
function load(){
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  if (!data) return;
  Object.keys(data).forEach(id => {
    if (!ITEMS[id]) return;
    S[id] = Object.assign({tries:0, status:"open", sel:null, built:[]}, data[id]);
    const it = ITEMS[id], st = S[id];
    if (it.t === "choice" && st.sel !== null)
      document.querySelectorAll(`.opt[data-id="${id}"]`).forEach(o=>o.classList.toggle("sel", +o.dataset.i===st.sel));
    else if (it.t === "order") drawBuilt(id);
    else if (st.val) document.querySelector(`input[data-id="${id}"]`).value = st.val;
    paint(id, false);
  });
  Object.keys(TASK_ITEMS).forEach(updateScore);
}

function updateScore(tid){
  const ids = TASK_ITEMS[tid];
  const done = ids.filter(id=>S[id].status!=="open").length;
  const ok = ids.filter(id=>S[id].status==="ok").length;
  document.getElementById("sc-"+tid).textContent = done ? `${ok} von ${ids.length} richtig${done<ids.length?` · ${ids.length-done} offen`:" · fertig ✓"}` : "";
  EX.forEach(ex => {
    const all = ex.tasks.flatMap(t=>TASK_ITEMS[t.id]);
    const d = document.getElementById("dot-"+ex.id);
    if (d) d.classList.toggle("done", all.every(id=>S[id].status!=="open"));
    updateLzBadge(ex);
  });
}

function resetTask(tid){
  TASK_ITEMS[tid].forEach(id => {
    S[id] = {tries:0, status:"open", sel:null, built:[]};
    const w = document.getElementById("w-"+id);
    w.classList.remove("is-ok","is-bad","is-rev");
    document.getElementById("fb-"+id).className="fb"; document.getElementById("fb-"+id).innerHTML="";
    w.querySelectorAll("input").forEach(i=>{i.value="";i.disabled=false;});
    w.querySelectorAll(".opt").forEach(b=>{b.classList.remove("sel");b.disabled=false;});
    w.querySelectorAll(".tile").forEach(b=>{b.classList.remove("used");b.disabled=false;});
    const u = w.querySelector(".undo"); if (u) u.disabled=false;
    const b = document.getElementById("b-"+id); if (b) b.innerHTML="";
  });
  updateScore(tid);
  save();
}

function drawBuilt(id){
  const it = ITEMS[id], st = S[id];
  document.getElementById("b-"+id).innerHTML = st.built.map(i=>`<span class="tile">${it.w[i]}</span>`).join("");
  document.querySelectorAll(`#w-${id} .tiles .tile`).forEach(b=>b.classList.toggle("used", st.built.includes(+b.dataset.i)));
}

const LEVELS = [["noch offen","b0"],["nicht erreicht","b1"],["erreicht","b2"],["gut erreicht","b3"],["sehr gut erreicht","b4"]];
/* Auswertung eines Lernziels (Übung) */
function evalEx(ex){
  const ids = ex.tasks.flatMap(t=>TASK_ITEMS[t.id]);
  const done = ids.filter(id=>S[id].status!=="open");
  const pts = done.reduce((a,id)=>a+(S[id].pts||0),0);
  const exact = pts/ids.length*100;
  let lv = 0;
  if (done.length === ids.length) lv = exact<60?1:exact<75?2:exact<95?3:4;
  return {ids, done, pts, pct:Math.round(exact), lv};
}
function updateLzBadge(ex){
  const el = document.getElementById("lzres-"+ex.id); if (!el) return;
  const r = evalEx(ex);
  if (r.lv === 0) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="lzres-box"><span>Lernziel abgeschlossen · ${r.pts} von ${r.ids.length} Punkten</span><span class="badge ${LEVELS[r.lv][1]}">${LEVELS[r.lv][0]}</span></div>`;
}

function renderResults(){
  const levels = LEVELS;
  let tot=0, max=0;
  let rows = EX.map(ex => {
    const {ids, done, pts, pct, lv} = evalEx(ex);
    tot+=pts; max+=ids.length;
    return `<div class="res-row"><div><b>${ex.title}</b><div class="muted" style="font-size:.9rem">${ex.lz}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="muted" style="font-size:.85rem">${pts} von ${ids.length} Punkten · ${done.length}/${ids.length} Aufgaben bearbeitet</div></div>
      <div class="badge ${levels[lv][1]}">${levels[lv][0]}</div></div>`;
  }).join("");
  document.getElementById("sec-res").innerHTML = `<div class="card"><h2>Auswertung</h2>
    <p class="muted">1 Punkt = beim 1. Versuch richtig · ½ Punkt = beim 2. Versuch richtig · 0 Punkte = Lösung angezeigt</p>
    ${rows}
    <p style="margin-top:16px"><b>Total: ${tot} von ${max} Punkten (${Math.round(tot/max*100)} %)</b></p>
    <p class="muted">Wo du „nicht erreicht“ oder „erreicht“ hast: Lies die Theorie zu diesem Thema nochmals durch und klicke bei den Übungen auf „Neu beginnen“.</p>
    <div class="actions"><button class="btn" data-go="theory">Zur Theorie</button><button class="btn ghost" id="resetAll">Alles zurücksetzen</button></div></div>`;
}

render();
load();
show("start");

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.tab) return show(b.dataset.tab);
  if (b.dataset.go) return show(b.dataset.go);
  if (b.dataset.check) return check(b.dataset.check);
  if (b.dataset.reset) return resetTask(b.dataset.reset);
  if (b.id === "resetAll") {
    if (!confirmReset()) return;
    Object.keys(TASK_ITEMS).forEach(resetTask); return renderResults();
  }
  if (b.dataset.undo) { const id=b.dataset.undo; S[id].built.pop(); drawBuilt(id); return save(); }
  if (b.classList.contains("opt")) {
    const id=b.dataset.id; S[id].sel=+b.dataset.i;
    document.querySelectorAll(`.opt[data-id="${id}"]`).forEach(o=>o.classList.toggle("sel", o===b));
    document.getElementById("w-"+id).classList.remove("is-bad");
    return save();
  }
  if (b.classList.contains("tile") && b.dataset.id) {
    const id=b.dataset.id, i=+b.dataset.i;
    if (!S[id].built.includes(i)) { S[id].built.push(i); drawBuilt(id); document.getElementById("w-"+id).classList.remove("is-bad"); save(); }
  }
});
document.addEventListener("input", e => {
  const id = e.target.dataset.id;
  if (id) { document.getElementById("w-"+id).classList.remove("is-bad"); S[id].val = e.target.value; save(); }
});
/* Sicherheitsabfrage ohne Browser-Dialog: zweimal klicken */
let resetArmed = false;
function confirmReset(){
  const b = document.getElementById("resetAll");
  if (resetArmed) { resetArmed = false; return true; }
  resetArmed = true; b.textContent = "Wirklich alles löschen? Nochmals klicken";
  setTimeout(()=>{ resetArmed = false; if (document.getElementById("resetAll")) b.textContent = "Alles zurücksetzen"; }, 4000);
  return false;
}
document.addEventListener("keydown", e => {
  if (e.key==="Enter" && e.target.matches("input[data-id]")) {
    const t = e.target.closest(".card[id^='task-']"); if (t) check(t.id.slice(5));
  }
});
</script>
