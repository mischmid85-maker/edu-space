<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake mit Hindernissen</title>
    <!-- PyScript Assets laden -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background-color: #111;
            color: #00ff00;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff00;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #score-board {
            font-size: 16px;
            margin-bottom: 20px;
        }

        #game-container {
            position: relative;
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            background-color: #051105;
        }

        canvas {
            display: block;
            background-color: #020a02;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 14px;
            text-align: center;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 10px;
            color: #888;
            text-shadow: none;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>RETRO SNAKE</h1>
    <div id="score-board">SCORE: <span id="score">0</span></div>

    <div id="game-container">
        <div id="loading">BOOTING PYTHON SYSTEM...</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls-hint">
        STEUERUNG: PFEILTASTEN<br>
        ACHTUNG: RAMME NICHT DIE ROTEN BLÖCKE (HINDERNISSE)!
    </div>

    <!-- Python Logik via PyScript -->
    <script type="py">
        import random
        from pyodide.ffi import create_proxy
        from js import document, window

        # Canvas Setup
        canvas = document.getElementById("gameCanvas")
        ctx = canvas.getContext("2d")
        loading_text = document.getElementById("loading")

        # Konstanten
        GRID_SIZE = 20
        GRID_COUNT = 20  # 400 / 20

        # Spielvariablen
        snake = [(10, 10), (9, 10), (8, 10)]
        direction = (1, 0)
        next_direction = (1, 0)
        food = (5, 5)
        obstacles = []
        score = 0
        game_over = False

        def generate_food_and_obstacles():
            global food, obstacles
            # Hindernisse generieren (feste Anzahl an zufälligen Positionen)
            obstacles = []
            while len(obstacles) < 8:
                obs = (random.randint(0, GRID_COUNT-1), random.randint(0, GRID_COUNT-1))
                # Nicht auf der Schlange oder dem Startbereich platzieren
                if obs not in snake and obs not in obstacles and obs[0] > 3:
                    obstacles.append(obs)
            
            # Futter platzieren
            respawn_food()

        def respawn_food():
            global food
            while True:
                food = (random.randint(0, GRID_COUNT-1), random.randint(0, GRID_COUNT-1))
                if food not in snake and food not in obstacles:
                    break

        def draw_cell(x, y, color, is_glow=False):
            ctx.fillStyle = color
            if is_glow:
                ctx.shadowBlur = 10
                ctx.shadowColor = color
            else:
                ctx.shadowBlur = 0
            
            ctx.fillRect(x * GRID_SIZE + 1, y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2)
            ctx.shadowBlur = 0  # Reset

        def draw():
            # Hintergrund löschen
            ctx.fillStyle = "#020a02"
            ctx.fillRect(0, 0, canvas.width, canvas.height)

            # Rasterlinien ganz dezent für Retro-Look
            ctx.strokeStyle = "#041504"
            ctx.lineWidth = 1
            for i in range(GRID_COUNT):
                ctx.beginPath()
                ctx.moveTo(i * GRID_SIZE, 0)
                ctx.lineTo(i * GRID_SIZE, canvas.height)
                ctx.stroke()
                ctx.beginPath()
                ctx.moveTo(0, i * GRID_SIZE)
                ctx.lineTo(canvas.width, i * GRID_SIZE)
                ctx.stroke()

            # Hindernisse zeichnen (Rot / CRT Retro Style)
            for obs in obstacles:
                draw_cell(obs[0], obs[1], "#ff0055", is_glow=True)

            # Futter zeichnen (Gelb/Orange)
            draw_cell(food[0], food[1], "#ffcc00", is_glow=True)

            # Schlange zeichnen (Klassisch Grün)
            for idx, segment in enumerate(snake):
                color = "#00ff00" if idx == 0 else "#00aa00"
                draw_cell(segment[0], segment[1], color, is_glow=(idx == 0))

            if game_over:
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)"
                ctx.fillRect(0, 0, canvas.width, canvas.height)
                ctx.fillStyle = "#ff0055"
                ctx.font = "16px 'Press Start 2P'"
                ctx.textAlign = "center"
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10)
                ctx.fillStyle = "#00ff00"
                ctx.font = "10px 'Press Start 2P'"
                ctx.fillText("LEERTASTE FÜR RESTART", canvas.width / 2, canvas.height / 2 + 20)

        def update():
            global snake, direction, food, score, game_over, next_direction

            if game_over:
                return

            direction = next_direction
            head = snake[0]
            new_head = (head[0] + direction[0], head[1] + direction[1])

            # Kollision mit Wand
            if new_head[0] < 0 or new_head[0] >= GRID_COUNT or new_head[1] < 0 or new_head[1] >= GRID_COUNT:
                game_over = True
                return

            # Kollision mit sich selbst oder Hindernissen
            if new_head in snake or new_head in obstacles:
                game_over = True
                return

            # Schlange bewegen
            snake.insert(0, new_head)

            # Futter gefressen?
            if new_head == food:
                score += 10
                document.getElementById("score").innerText = str(score)
                respawn_food()
            else:
                snake.pop()

        def game_loop(*args):
            update()
            draw()
            # Loop alle 130ms fortsetzen (klassisches Retro-Tempo)
            window.setTimeout(game_loop_proxy, 130)

        def handle_keydown(event):
            global next_direction, game_over, snake, direction, score
            
            key = event.key
            if key == "ArrowUp" and direction != (0, 1):
                next_direction = (0, -1)
                event.preventDefault()
            elif key == "ArrowDown" and direction != (0, -1):
                next_direction = (0, 1)
                event.preventDefault()
            elif key == "ArrowLeft" and direction != (1, 0):
                next_direction = (-1, 0)
                event.preventDefault()
            elif key == "ArrowRight" and direction != (-1, 0):
                next_direction = (1, 0)
                event.preventDefault()
            elif key == " " and game_over:  # Leertaste für Restart
                snake = [(10, 10), (9, 10), (8, 10)]
                direction = (1, 0)
                next_direction = (1, 0)
                score = 0
                document.getElementById("score").innerText = "0"
                game_over = False
                generate_food_and_obstacles()

        # Proxies für JavaScript Callbacks registrieren
        game_loop_proxy = create_proxy(game_loop)
        keydown_proxy = create_proxy(handle_keydown)

        # Event Listener hinzufügen
        window.addEventListener("keydown", keydown_proxy)

        # Spiel initialisieren
        loading_text.style.display = "none"
        generate_food_and_obstacles()
        game_loop()
    </script>
</body>
</html>
